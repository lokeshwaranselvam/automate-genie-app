<div id="ec-app">
  <header class="ec-header">
    <button id="ec-back" type="button" aria-label="Back"></button>
    <h1>Expense Claim</h1>
  </header>
  <main id="ec-content" class="ec-body" aria-live="polite"></main>
  <dialog
    id="ec-dialog"
    aria-modal="true"
    aria-labelledby="ec-dialog-title"
  ></dialog>
</div>
<script>
  (() => {
    "use strict";
    const root = document.getElementById("ec-app");
    if (!root || root.dataset.started) return;
    root.dataset.started = "true";
    const $ = (id) => document.getElementById(id),
      content = $("ec-content"),
      modal = $("ec-dialog"),
      API = "/api/method/create_expense_claim_from_mobile";
    const state = {
      user: null,
      stopped: false,
      csrf: null,
      options: null,
      policy: { fields: {}, rules: {}, uploads: {} },
      hasPolicy: false,
      busy: false,
      loading: false,
      loadingApprovers: false,
      approverError: "",
      uncertain: false,
      version: 0,
      employee: "",
      approver: "",
      rows: [],
      bills: [],
      nextId: 0,
    };
    function el(tag, attrs = {}, ...children) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(attrs)) {
        if (key === "class") node.className = value;
        else if (key.startsWith("on") && typeof value === "function")
          node.addEventListener(key.slice(2), value);
        else if (key === "disabled") node.disabled = !!value;
        else node.setAttribute(key, String(value));
      }
      for (const child of children.flat())
        if (child !== null && child !== undefined)
          node.append(
            typeof child === "object"
              ? child
              : document.createTextNode(String(child)),
          );
      return node;
    }
    function icon(name) {
      const paths = {
        back: "M19 12H5m7-7-7 7 7 7",
        down: "m6 9 6 6 6-6",
        next: "m9 5 7 7-7 7",
        calendar: "M4 5h16v16H4zM4 10h16M8 3v4M16 3v4M8 14h2M14 14h2M8 18h2",
        bell: "M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4",
      };
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      for (const [key, value] of Object.entries({
        viewBox: "0 0 24 24",
        width: 22,
        height: 22,
        fill: "none",
        stroke: "currentColor",
        "stroke-width": 1.8,
        "stroke-linecap": "round",
        "stroke-linejoin": "round",
        "aria-hidden": "true",
      }))
        svg.setAttribute(key, String(value));
      const path = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path",
      );
      path.setAttribute("d", paths[name]);
      svg.append(path);
      return svg;
    }
    function plain(value) {
      const node = document.createElement("textarea");
      node.innerHTML = String(value ?? "").replace(/<[^>]*>/g, "");
      return node.value.trim();
    }

    function notifyNative(action, extra = {}) {
      if (window.GenieExpenseClaim?.postMessage)
        window.GenieExpenseClaim.postMessage(
          JSON.stringify({ action, ...extra }),
        );
    }
    function clearBills() {
      for (const bill of state.bills)
        if (bill.url) URL.revokeObjectURL(bill.url);
      state.bills = [];
    }
    function stopSession(message) {
      state.stopped = true;
      state.options = null;
      state.csrf = null;
      state.employee = "";
      state.approver = "";
      state.rows = [];
      clearBills();
      state.version++;
      if (modal.open) modal.close();
      content.replaceChildren(el("p", { class: "ec-message" }, message));
      notifyNative("session_expired");
    }
    class ApiError extends Error {
      constructor(message, status = 0, uncertain = false) {
        super(message);
        this.status = status;
        this.uncertain = uncertain;
      }
    }
    async function raw(path, { query, body, token, html = false } = {}) {
      const url = new URL(path, window.location.origin);
      if (
        url.origin !== window.location.origin ||
        !url.pathname.startsWith("/")
      )
        throw new Error("Invalid ERP request.");
      for (const [k, v] of Object.entries(query || {}))
        url.searchParams.set(k, typeof v === "string" ? v : JSON.stringify(v));
      const controller = new AbortController(),
        timer = setTimeout(() => controller.abort(), body ? 90000 : 25000);
      try {
        const headers = {
          Accept: html ? "text/html" : "application/json",
          "Cache-Control": "no-cache",
        };
        if (body) {
          headers["X-Frappe-CSRF-Token"] = token;
        }
        const response = await fetch(url.href, {
          method: body ? "POST" : "GET",
          credentials: "same-origin",
          cache: "no-store",
          redirect: "error",
          headers,
          signal: controller.signal,
          body: body || undefined,
        });
        if (html) {
          if (!response.ok)
            throw new ApiError(
              "Could not initialize your update session.",
              response.status,
            );
          return response.text();
        }
        let data;
        try {
          data = await response.json();
        } catch (_) {
          throw new ApiError(
            "ERP did not confirm the request. Refresh before retrying.",
            response.status,
            !!body,
          );
        }
        if (!response.ok || data.exc_type || data.exception) {
          const csrf =
            data.exc_type === "CSRFTokenError" ||
            String(data.exception || "").startsWith(
              "frappe.exceptions.CSRFTokenError:",
            );
          let message =
            response.status === 403
              ? "You do not have permission for this Expense Claim."
              : response.status === 401
                ? "Your session expired. Sign in again."
                : `ERP could not complete this action (${response.status}).`;
          if (response.status < 500 || csrf) {
            try {
              const entries =
                typeof data._server_messages === "string"
                  ? JSON.parse(data._server_messages)
                  : data._server_messages;
              const messages = (entries || [])
                .map((x) => (typeof x === "string" ? JSON.parse(x) : x))
                .map((x) => plain(x.message))
                .filter(Boolean);
              if (messages.length) message = messages.join("\n");
              else if (typeof data.message === "string")
                message = plain(data.message);
            } catch (_) {}
          }
          const error = new ApiError(
            message,
            response.status,
            !!body && response.status >= 500,
          );
          error.csrf = csrf;
          if (response.status === 401)
            stopSession(
              "Your ERP session expired. Sign in again and reopen Expense Claim.",
            );
          throw error;
        }
        return data;
      } catch (error) {
        if (error instanceof ApiError) throw error;
        throw new ApiError(
          body
            ? "The submission result is uncertain. Check ERP before trying again."
            : "ERP could not be reached. Check your connection and retry.",
          0,
          !!body,
        );
      } finally {
        clearTimeout(timer);
      }
    }
    async function session() {
      if (state.stopped)
        throw new Error("Reopen this page after signing in again.");
      let result;
      try {
        result = await raw("/api/method/frappe.auth.get_logged_user");
      } catch (error) {
        if (error.status === 401 || error.status === 403)
          stopSession(
            "Your ERP session expired. Sign in again and reopen Expense Claim.",
          );
        throw error;
      }
      const user = result.message;
      if (
        typeof user !== "string" ||
        !user ||
        user === "Guest" ||
        (state.user && user !== state.user)
      ) {
        stopSession(
          "Your ERP session expired or the signed-in account changed. Reopen Expense Claim from the app.",
        );
        throw new Error("Your session changed.");
      }
      state.user = user;

      return user;
    }
    async function csrf(force = false) {
      if (force) state.csrf = null;
      if (state.csrf) return state.csrf;
      let token = !force && window.frappe && window.frappe.csrf_token;
      if (!token || token === "None") {
        const html = await raw("/app", { html: true });
        token = (html.match(/frappe\.csrf_token\s*=\s*["']([^"']+)["']/) ||
          [])[1];
      }
      if (!token || token === "None")
        throw new Error(
          "Could not initialize your update session. Reopen this page after signing in.",
        );
      state.csrf = token;
      return token;
    }
    async function write(path, makeBody) {
      await session();
      let result;
      for (let attempt = 0; attempt < 2; attempt++) {
        try {
          const token = await csrf(attempt > 0);
          validate();
          result = await raw(path, { body: makeBody(token), token });
          break;
        } catch (error) {
          if (!error.csrf || attempt) throw error;
          await session();
        }
      }
      try {
        await session();
      } catch (error) {
        error.uncertain = true;
        throw error;
      }
      return result;
    }

    function dayValue(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }
    function today() {
      return dayValue(new Date());
    }
    function validDate(value) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
      const d = new Date(value + "T12:00:00");
      return !Number.isNaN(d.getTime()) && dayValue(d) === value;
    }
    function caption(value) {
      return validDate(value)
        ? new Date(value + "T12:00:00").toLocaleDateString("en-GB", {
            day: "2-digit",
            month: "short",
            year: "numeric",
          })
        : "Choose date";
    }
    function popup(title, message, onClose) {
      modal.replaceChildren(
        el("h2", { id: "ec-dialog-title" }, title),
        el("p", {}, message),
        el(
          "button",
          {
            type: "button",
            class: "ec-primary",
            onclick: () => {
              modal.close();
              onClose?.();
            },
          },
          "OK",
        ),
      );
      if (!modal.open) {
        if (modal.showModal) modal.showModal();
        else modal.setAttribute("open", "");
      }
    }

    function field(name) {
      return state.policy.fields[name] || {};
    }
    function required(name, legacy = true) {
      return Object.prototype.hasOwnProperty.call(state.policy.fields, name)
        ? field(name).required === true
        : legacy;
    }
    function bounds() {
      const year = new Date().getFullYear();
      return { minimum: `${year - 10}-01-01`, maximum: `${year + 1}-12-31` };
    }
    function blocked() {
      return state.busy || state.uncertain || state.stopped;
    }
    function newRow(type = "") {
      return {
        id: ++state.nextId,
        expense_type: type,
        amount: "",
        expense_date: today(),
        description: "",
      };
    }
    function syncRows() {
      for (const row of state.rows) {
        for (const name of [
          "expense_type",
          "amount",
          "description",
          "expense_date",
        ]) {
          const rule = field(name);
          if (
            Object.prototype.hasOwnProperty.call(rule, "default") &&
            (rule.read_only === true || !row[name])
          )
            row[name] = String(rule.default ?? "");
        }
        if (
          !state.options.expense_types.some((x) => x.value === row.expense_type)
        )
          row.expense_type = state.options.expense_types[0].value;
      }
    }
    function parseAmount(value) {
      const text = String(value).trim().replace(/,/g, "");
      return text ? Number(text) : NaN;
    }
    function totalAmount() {
      return state.rows.reduce((sum, row) => {
        const value = parseAmount(row.amount);
        return sum + (Number.isFinite(value) && value > 0 ? value : 0);
      }, 0);
    }
    function updateTotal() {
      const total = $("ec-total");
      if (total)
        total.textContent = `${state.options.currency} ${totalAmount().toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    }
    function label(name, text, id) {
      return el(
        "label",
        { for: id },
        text,
        required(name) ? el("span", { class: "ec-required" }, " *") : null,
      );
    }
    function wrapper(name, text, id, control) {
      const box = el("div", { class: "ec-field" });
      box.hidden = field(name).visible === false;
      box.append(label(name, text, id), control);
      return box;
    }
    function popupError(error) {
      popup("Check claim", error.message || String(error));
    }
    function searchControl(
      id,
      options,
      value,
      placeholder,
      onSelect,
      disabled = false,
    ) {
      const selected = options.find((x) => x.value === value),
        panel = el("div", {
          class: "ec-panel ec-options",
          role: "listbox",
          hidden: "",
          "aria-label": placeholder,
        });
      const input = el("input", {
        id,
        class: "ec-input",
        type: "text",
        autocomplete: "off",
        placeholder,
        role: "combobox",
        "aria-autocomplete": "list",
        "aria-expanded": "false",
        "aria-controls": id + "-options",
        disabled,
      });
      panel.id = id + "-options";
      input.value = selected?.label || "";
      function show() {
        if (input.disabled || blocked()) return;
        const q = input.value.trim().toLowerCase();
        const matches = options
          .filter(
            (x) =>
              !q ||
              x.label.toLowerCase().includes(q) ||
              x.value.toLowerCase().includes(q),
          )
          .slice(0, 30);
        panel.replaceChildren(
          ...matches.map((item) =>
            el(
              "button",
              {
                type: "button",
                role: "option",
                "data-value": item.value,
                "aria-selected": item.value === value,
                onclick: () => {
                  if (blocked()) return;
                  panel.hidden = true;
                  input.setAttribute("aria-expanded", "false");
                  onSelect(item.value);

          !state.options.expense_types.some((x) => x.value === row.expense_type)
        )
          throw new Error(prefix + "Choose an expense type.");
        if (
          !validDate(row.expense_date) ||
          row.expense_date < minimum ||
          row.expense_date > maximum
        )
          throw new Error(
            prefix + "Choose a date within the existing permitted date range.",
          );
        for (const [name, title] of [
          ["description", "Description"],
          ["amount", "Amount"],
          ["expense_type", "Expense Type"],
        ]) {
          const value = String(row[name] || "").trim(),
            rule = field(name);
          if (required(name) && !value)
            throw new Error(prefix + title + " is required.");
          if (
            Number(rule.max_length) > 0 &&
            value.length > Number(rule.max_length)
          )
            throw new Error(prefix + title + " is too long.");
          if (
            Array.isArray(rule.options) &&
            value &&
            !rule.options.includes(value)
          )
            throw new Error(prefix + "Choose a valid " + title + ".");
        }
        const amount = parseAmount(row.amount),
          rule = field("amount");
        if (
          !Number.isFinite(amount) ||
          (!Object.prototype.hasOwnProperty.call(
            state.policy.fields,
            "amount",
          ) &&
            amount <= 0) ||
          (typeof rule.min_exclusive === "number" &&
            amount <= rule.min_exclusive) ||
          (typeof rule.max_value === "number" && amount > rule.max_value)
        )
          throw new Error(
            prefix + "Enter an amount within the permitted limits.",
          );
      }
      validateBills(state.bills);
    }
    function makeBody(token) {
      const rows = state.rows.map((row) => ({
          expense_type: row.expense_type.trim(),
          amount: String(row.amount).trim().replace(/,/g, ""),
          expense_date: row.expense_date,
          description: row.description.trim(),
        })),
        body = new FormData();
      for (const [key, value] of Object.entries({
        employee: state.employee.trim(),
        expense_approver: state.approver.trim(),
        ...rows[0],
        ...(state.options.supports_multiple_expenses
          ? { expenses: JSON.stringify(rows) }
          : {}),
        csrf_token: token,
      }))
        body.append(key, value);
      for (const bill of state.bills)
        body.append("file", bill.file, bill.file.name);
      return body;
    }
    async function submit() {
      if (
        blocked() ||
        state.loading ||
        state.loadingApprovers ||
        !state.options
      )
        return;
      try {
        validate();
      } catch (error) {
        popupError(error);
        return;
      }
      state.busy = true;
      notifyNative("busy", { value: true });
      renderForm();
      const expenseCount = state.rows.length,
        billCount = state.bills.length;
      try {
        const response = await write(API, makeBody),
          message = response.message;
        let confirmed =
          message &&
          typeof message.name === "string" &&
          message.name.trim() &&
          (!billCount ||
            (typeof message.bill_file_url === "string" &&
              message.bill_file_url));
        if (state.options.supports_multiple_expenses)
          confirmed =
            confirmed &&
            Array.isArray(message.expenses) &&
            message.expenses.length === expenseCount &&
            Array.isArray(message.bill_files) &&
            message.bill_files.length === billCount &&
            message.bill_files.every(
              (bill) =>
                bill && typeof bill.file_url === "string" && bill.file_url,
            );
        if (!confirmed) {
          const error = new Error(
            "ERP did not confirm every expense and bill. Check Expense Claims before retrying.",
          );
          error.uncertain = true;
          throw error;
        }
        const type = state.rows[0].expense_type;
        clearBills();
        state.rows = [newRow(type)];
        syncRows();
        popup(
          "Success",
          `Expense Claim ${message.name} was created with ${expenseCount} ${expenseCount === 1 ? "expense" : "expenses"} and ${billCount} ${billCount === 1 ? "bill" : "bills"} attached.`,
        );
      } catch (error) {
        state.uncertain = error.uncertain === true;
        if (!state.stopped)
          popup(
            state.uncertain
              ? "Check ERPNext before retrying"
              : "Unable to submit",
            error.message,
          );
      } finally {
        state.busy = false;
        notifyNative("busy", { value: false });
        if (!state.stopped) renderForm();
      }
    }
    function back() {
      if (state.busy) return;
      if (modal.open) {
        modal.close();
        return;
      }
      if (window.GenieExpenseClaim) notifyNative("close");
      else if (window.history.length > 1) window.history.back();
    }
    // EC_BOOTSTRAP
    $("ec-back").replaceChildren(icon("back"));
    $("ec-back").addEventListener("click", back);
    window.addEventListener("genie-expense-back", back);
    window.addEventListener("pagehide", () => {
      if (!state.busy) clearBills();
    });
    modal.addEventListener("cancel", (event) => {
      if (state.busy) event.preventDefault();
    });
    loadOptions();
  })();
</script>
