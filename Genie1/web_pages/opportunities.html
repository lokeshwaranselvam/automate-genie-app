<!-- ERPNext Web Page: route genie-opportunities, Content Type HTML. No credentials belong here. -->
<style>

  #go-app .go-head {

  #go-app .go-control {

<div id="go-app">
  <header class="go-head">
    <button id="go-back" type="button" aria-label="Back">←</button>
    <h1 id="go-title">Opportunities</h1>
    <span id="go-avatar" class="go-avatar" aria-label="Session user">…</span>
  </header>
  <main id="go-main" class="go-main">
    <div class="go-container">
      <div id="go-content" aria-live="polite">
        <p class="go-message">Verifying your ERP session…</p>
      </div>
    </div>
  </main>
  <dialog
    id="go-dialog"
    class="go-modal"
    aria-labelledby="go-dialog-title"
  ></dialog>
  <dialog
    id="go-warning"
    class="go-modal go-warning"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="go-warning-title"
    aria-describedby="go-warning-message"
  ></dialog>
</div>
<script>
  (() => {
    "use strict";
    const root = document.getElementById("go-app");
    if (!root || root.dataset.started) return;
    root.dataset.started = "true";
    const $ = (id) => document.getElementById(id);
    const content = $("go-content"),
      modal = $("go-dialog");
    const POLICY = "/api/method/mobile_opportunity_policy";
    const state = {
      user: null,
      stopped: false,
      document: null,
      canEdit: null,
      phone: "",
      status: "",
      rows: [],
      offset: 0,
      more: false,
      listVersion: 0,
      routeVersion: 0,
      busy: false,
      csrf: null,
    };
    let searchTimer,
      ownerTimer,
      modalVersion = 0,
      listBusy = false;
    function el(tag, attrs = {}, ...children) {
      const n = document.createElement(tag);
      for (const [key, value] of Object.entries(attrs)) {
        if (key === "class") n.className = value;
        else if (key.startsWith("on") && typeof value === "function")
          n.addEventListener(key.slice(2), value);
        else if (key === "disabled") n.disabled = !!value;
        else n.setAttribute(key, String(value));
      }
      for (const child of children.flat())
        if (child !== null && child !== undefined)
          n.append(
            typeof child === "object"
              ? child
              : document.createTextNode(String(child)),
          );
      return n;
    }
    function icon(name, size = 20) {
      const paths = {
        warning: "M12 3 2 21h20zM12 9v5M12 17v1",
        back: "M19 12H5m7-7-7 7 7 7",
        chevron: "m9 5 7 7-7 7",
        down: "m6 9 6 6 6-6",
        search: "M21 21l-5-5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0",
        close: "m6 6 12 12M6 18 18 6",
        filter: "M4 6h16M7 12h10M10 18h4",
        refresh:
          "M20 7v5h-5M4 17v-5h5M5 8a8 8 0 0 1 13-3l2 2M4 17l2 2a8 8 0 0 0 13-3",
        user: "M20 21v-2a6 6 0 0 0-6-6h-4a6 6 0 0 0-6 6v2M16 5a4 4 0 1 1-8 0 4 4 0 0 1 8 0",
        briefcase:
          "M3 7h18v14H3zM8 7V3h8v4M3 12a22 22 0 0 0 18 0M10 12h4v4h-4z",
        document: "M14 2H5v20h14V7zM14 2v5h5M8 12h8M8 16h8",
        calendar: "M4 5h16v16H4zM4 10h16M8 3v4M16 3v4M8 14h2M14 14h2M8 18h2",
        edit: "m16 3 5 5-12 12-6 1 1-6zM14 5l5 5",
        phone: "M6 3 3 5c0 9 7 16 16 16l2-3-5-4-3 3-6-6 3-3z",
        mail: "M3 5h18v14H3zM3 5l9 8 9-8",
        pin: "M19 9c0 6-7 13-7 13S5 15 5 9a7 7 0 1 1 14 0M15 9a3 3 0 1 1-6 0 3 3 0 0 1 6 0",
        chart: "M4 20V4M4 20h17M8 16v-4M13 16V8M18 16V6",
        notes: "M4 3h16v15l-5 3H4zM8 8h8M8 12h8M8 16h4",
        check: "m5 12 4 4L19 6",
      };
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      for (const [key, value] of Object.entries({
        viewBox: "0 0 24 24",
        width: size,
        height: size,
        fill: "none",
        stroke: "currentColor",
        "stroke-width": "1.8",
        "stroke-linecap": "round",
        "stroke-linejoin": "round",
        "aria-hidden": "true",
        focusable: "false",
        class: "go-icon",
      }))
        svg.setAttribute(key, String(value));
      const path = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path",
      );
      path.setAttribute("d", paths[name] || paths.document);
      svg.append(path);
      return svg;
    }
    function fieldIcon(key) {
      if (isPhone(key)) return "phone";
      if (
        key === "owner" ||
        key.includes("owner") ||
        key.includes("person") ||
        key.includes("name")
      )
        return "user";
      if (key.includes("email")) return "mail";
      if (key.includes("date") || key.includes("closing")) return "calendar";
      if (
        key.includes("address") ||
        ["city", "state", "country", "territory"].includes(key) ||
        key.includes("pincode")
      )
        return "pin";
      return "document";
    }
    function filterCaption(value) {
      return [icon("filter"), el("span", {}, `Status: ${value || "All"}`)];
    }
    function choiceControl(id, choices, initial, name) {
      const input = el("input", { id, type: "hidden" });
      input.value = initial;
      const panel = el("div", {
        class: "go-options",
        id: id + "-options",
        role: "listbox",
        "aria-label": name,
        hidden: "",
      });
      const button = el("button", {
        type: "button",
        class: "go-control-toggle",
        id: id + "-toggle",
        "aria-haspopup": "listbox",
        "aria-expanded": "false",
        "aria-controls": id + "-options",
        "aria-label": name,
      });
      function caption() {
        const choice = choices.find((x) => x.value === input.value);
        button.replaceChildren(
          el(
            "span",
            {},
            choice ? choice.label : String(input.value || "Select " + name),
          ),
          icon("down"),
        );
      }
      function close() {
        panel.hidden = true;
        button.setAttribute("aria-expanded", "false");
      }
      function toggle() {
        if (button.disabled) return;
        panel.hidden = !panel.hidden;
        button.setAttribute("aria-expanded", String(!panel.hidden));
        if (!panel.hidden) {
          const selected =
            panel.querySelector('[aria-selected="true"]') ||
            panel.querySelector("button");
          selected?.focus();
        }
      }
      for (const choice of choices) {
        const option = el(
          "button",
          {

      if (
        doc.owner !== state.user ||
        !Object.entries(doc).some(
          ([key, value]) =>
            isPhone(key) && String(value ?? "").trim() === number,
        )
      ) {
        view.body.append(
          el(
            "p",
            { class: "go-error" },
            "The existing mobile calling rule requires you to be the Opportunity creator.",
          ),
        );
        return;
      }
      if (
        !/^[+0-9\s().-]+$/.test(number) ||
        !/^\d{7,15}$/.test(number.replace(/[+\s().-]/g, ""))
      ) {
        view.body.append(
          el(
            "p",
            { class: "go-error" },
            "Update this invalid contact number in ERP before calling.",
          ),
        );
        return;
      }
      view.body.append(el("p", {}, `Call ${number}?`));
      const call = el(
        "button",
        {
          class: "go-primary",
          onclick: async () => {
            if (state.busy) return;
            state.busy = true;
            call.disabled = true;
            view.cancel.disabled = true;
            try {
              assertOwner(doc);
              const r = await write("/api/method/smartflo.api.initiate_call", {
                doc: { ...doc, doctype: "Opportunity" },
                number,
              });
              const m = r.message;
              if (
                !m ||
                m.success === false ||
                m.success === 0 ||
                m.error ||
                ["error", "failed", "failure"].includes(
                  String(m.status || "").toLowerCase(),
                )
              )
                throw new Error(
                  typeof m?.message === "string"
                    ? plain(m.message)
                    : "The call could not be confirmed. Check your phone before trying again.",
                );
              view.body.replaceChildren(
                el("p", {}, "Call request sent. Please check your phone."),
              );
            } catch (error) {
              modalError(view, error);
            } finally {
              state.busy = false;
              view.cancel.disabled = false;
              view.cancel.textContent = "Close";
            }
          },
        },
        "Call",
      );
      view.actions.append(call);
    }
    async function route() {
      if (state.stopped) return;
      closeWarning(false);
      if (modal.open && !state.busy) modal.close();
      const id = currentId();
      if (id) {
        await loadDetail(id);
      } else {
        state.routeVersion++;
        state.document = null;
        setTitle(false);
        listShell();
        await loadList(false);
      }
    }
    modal.addEventListener("cancel", (event) => {
      if (state.busy) event.preventDefault();
      else modalVersion++;
    });
    $("go-warning").addEventListener("cancel", (event) => {
      event.preventDefault();
      closeWarning();
    });
    $("go-back").replaceChildren(icon("back", 22));
    $("go-back").addEventListener("click", back);
    window.addEventListener("hashchange", () => {
      if (state.busy) {
        if (state.document)
          window.history.replaceState(
            null,
            "",
            "#opportunity=" + encodeURIComponent(state.document.name),
          );
        return;
      }
      route();
    });
    window.addEventListener("genie-opportunities-refresh", () => {
      if (!state.busy) route();
    });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && state.user && !state.busy)
        session().catch((error) => {
          if (!state.stopped) stopSession(error.message);
        });
    });
    // GO_BOOTSTRAP
    session()
      .then(route)
      .catch((error) => {
        if (!state.stopped) errorView(error, () => window.location.reload());
      });
  })();
</script>
