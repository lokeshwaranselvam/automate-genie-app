  #pw-app {position:fixed;inset:0;z-index:1035;background:#f4f7fb;color:#17202a;font-family:PWRoboto,Roboto,Arial,sans-serif;font-size:14px;line-height:1.45;color-scheme:light;display:flex;flex-direction:column;overflow:hidden}
  #pw-app,#pw-app *{box-sizing:border-box}
  #pw-app [hidden]{display:none!important}
  #pw-app button,#pw-app input{font:inherit}
  #pw-app button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  #pw-app button:disabled{opacity:.55;cursor:default}
  #pw-app button:focus-visible,#pw-app input:focus-visible{outline:3px solid #aabfff;outline-offset:2px}
  #pw-app .pw-header{min-height:56px;display:flex;align-items:center;gap:16px;padding:0 16px 0 8px;background:linear-gradient(90deg,#0055ff,#442fef,#8000e5);color:white;flex-shrink:0}
  #pw-app .pw-header h1{color:#fff!important;font-size:20px;font-weight:700;line-height:1.25;margin:0;flex:1}
  #pw-app .pw-back{width:48px;height:48px;border:0;background:transparent;color:white;display:grid;place-items:center;flex-shrink:0}
  #pw-app .pw-icon{display:inline-block;width:24px;height:24px;flex-shrink:0;fill:currentColor;vertical-align:middle}
  #pw-app .pw-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 16px 30px;touch-action:pan-y}
  #pw-app .pw-content{max-width:900px;margin:auto}
  #pw-app .pw-count{display:flex;align-items:center;gap:14px;min-height:100px;padding:18px;background:#442fef;color:white;border-radius:12px;margin:4px 4px 8px;box-shadow:0 2px 2px #0002}
  #pw-app .pw-count .pw-icon{width:34px;height:34px}
  #pw-app .pw-count small{display:block;font-size:14px;color:#ffffffb3}
  #pw-app .pw-total{display:block;font-size:28px;font-weight:800;line-height:1.35}
  #pw-app .pw-team{font-size:17px;font-weight:800;color:#263445;margin:26px 4px 12px}
  #pw-app .pw-category{display:flex;align-items:center;gap:16px;text-align:left;width:calc(100% - 8px);margin:0 4px 8px;padding:8px 16px;min-height:56px;background:white;border:1px solid #e9e9ee;border-radius:12px;color:#202124;box-shadow:0 2px 1px #0003}
  #pw-app .pw-category .pw-label{flex:1;min-width:0;font-size:16px;font-weight:700;line-height:1.5}
  #pw-app .pw-bubble{display:grid;place-items:center;border-radius:50%;width:40px;height:40px;background:#eaf3ff;color:#442fef;flex-shrink:0}
  #pw-app .pw-number{font-size:16px;font-weight:800;color:#49494d}
  #pw-app .pw-chevron{color:#49494d}
  #pw-app .pw-section-count{margin:0;border-radius:22px;min-height:96px;background:#4830ef;box-shadow:0 8px 22px #26344510;border:1px solid #ffffff80}
  #pw-app .pw-section-count .pw-bubble{width:52px;height:52px;border-radius:16px;background:#ffffff26;color:white}
  #pw-app .pw-section-count .pw-icon{width:26px;height:26px}
  #pw-app .pw-section-count small{font-size:12px}
  #pw-app .pw-search{display:flex;align-items:center;gap:14px;margin:14px 0;padding:0 14px;background:#ffffffed;border-radius:16px;min-height:56px;box-shadow:0 8px 24px #26344508;color:#442fef}
  #pw-app .pw-search input{border:0;outline:0;min-width:0;width:100%;background:transparent;font-size:13px;color:#17202a;padding:15px 0}
  #pw-app .pw-search input::placeholder{color:#697586}
  #pw-app .pw-clear{border:0;background:transparent;color:#697586;min-width:32px;min-height:40px;font-size:22px}
  #pw-app .pw-item{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:14px;background:#ffffffed;border:1px solid #ffffffd0;border-radius:18px;margin-bottom:11px;box-shadow:0 8px 24px #26344508;color:#17202a;min-height:90px}
  #pw-app .pw-item .pw-bubble{width:44px;height:44px;border-radius:12px;background:#f4f7fb}
  #pw-app .pw-item .pw-bubble .pw-icon{width:21px;height:21px}
  #pw-app .pw-copy{flex:1;min-width:0}
  #pw-app .pw-item strong{font-size:14px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #pw-app .pw-item p{font-size:11.5px;color:#697586;margin:4px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
  #pw-app .pw-status{text-align:center;color:#697586;padding:30px 16px;overflow-wrap:anywhere}
  #pw-app .pw-empty{border-radius:18px;background:#fff;padding:30px}
  #pw-app .pw-empty .pw-icon{width:42px;height:42px;color:#2e7d32;margin-bottom:12px}
  #pw-app .pw-empty strong{display:block;color:#17202a;font-size:16px}
  #pw-app .pw-retry{display:block;border:0;border-radius:24px;padding:12px 22px;background:#442fef;color:#fff;margin:16px auto 0;font-weight:600}
  #pw-app .pw-spinner{width:26px;height:26px;border:3px solid #ddd7ff;border-top-color:#442fef;border-radius:50%;animation:pw-spin .8s linear infinite;margin:16px auto}
  #pw-app .pw-refresh-indicator{text-align:center;color:#697586;font-size:12px;min-height:0}
  #pw-app .pw-fields{background:white;border:1px solid #e1e8f0;border-radius:20px;padding:6px 16px}
  #pw-app .pw-field{display:flex;gap:8px;padding:12px 0;border-bottom:1px solid #e1e8f0;font-size:13.5px;overflow-wrap:anywhere}
  #pw-app .pw-field:last-child{border:0}
  #pw-app .pw-field dt{width:110px;flex-shrink:0;font-size:12px;font-weight:600;color:#697586}
  #pw-app .pw-field dd{margin:0;font-weight:600;white-space:pre-wrap}
  @keyframes pw-spin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){ #pw-app .pw-spinner{animation:none}}
</style>
