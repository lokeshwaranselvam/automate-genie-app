<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>TaskBoard</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f4f6f8;--surface:#fff;--surface2:#f8f9fa;--surface3:#e9ecef;
  --border:#dee2e6;--border2:#e9ecef;--text:#1a1a1a;--muted:#6c757d;--muted2:#adb5bd;
  --accent:#4f46e5;--accent2:#4338ca;--accent-bg:rgba(79,70,229,.1);
  --green:#198754;--green-bg:rgba(25,135,84,.1);--orange:#fd7e14;--orange-bg:rgba(253,126,20,.1);
  --red:#dc3545;--red-bg:rgba(220,53,69,.1);--yellow:#ffc107;--yellow-bg:rgba(255,193,7,.1);
  --pink:#d63384;--pink-bg:rgba(214,51,132,.1);
  --gold:#f59e0b;--silver:#6b7280;--bronze:#b45309;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);--shadow-md:0 4px 6px -1px rgba(0,0,0,.1);--shadow-lg:0 10px 15px -3px rgba(0,0,0,.1);
  --sidebar-w:280px;--header-h:52px;--bottom-nav-h:60px;--transition:.2s ease;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --bg:#0f0f10;--surface:#18181b;--surface2:#1e1e21;--surface3:#26262b;
  --border:#2a2a30;--border2:#33333a;--text:#f2f2f3;--muted:#8a8a99;--muted2:#5a5a6a;
  --accent:#6366f1;--accent2:#818cf8;--accent-bg:rgba(99,102,241,.12);
  --green:#22c55e;--green-bg:rgba(34,197,94,.12);--orange:#f97316;--orange-bg:rgba(249,115,22,.12);
  --red:#ef4444;--red-bg:rgba(239,68,68,.12);--gold:#fbbf24;
  --shadow-sm:none;--shadow-md:0 4px 6px -1px rgba(0,0,0,.4);--shadow-lg:0 10px 15px -3px rgba(0,0,0,.5);
}
[data-theme="bw"]{
  --bg:#fff;--surface:#fff;--surface2:#f5f5f5;--surface3:#e5e5e5;
  --border:#000;--border2:#ccc;--text:#000;--muted:#555;--muted2:#888;
  --accent:#000;--accent2:#333;--accent-bg:rgba(0,0,0,.05);
  --green:#000;--green-bg:rgba(0,0,0,.05);--orange:#333;--orange-bg:rgba(0,0,0,.05);
  --red:#000;--red-bg:rgba(0,0,0,.08);--shadow-sm:none;--shadow-md:none;--shadow-lg:none;
}
html,body{height:100%;font-family:'Geist',sans-serif;background:var(--bg);color:var(--text);overflow:auto;transition:background var(--transition),color var(--transition)}
.app{display:flex;height:100vh;overflow:hidden;position:relative}

.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:299;backdrop-filter:blur(4px)}
.sidebar-backdrop.open{display:block}

.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:300;box-shadow:var(--shadow-lg);position:fixed;top:0;left:0;height:100%;transform:translateX(-100%)}
.sidebar.open{transform:translateX(0)}
@media(min-width:769px){.sidebar{position:relative;transform:translateX(0);flex-shrink:0}.sidebar-backdrop{display:none!important}}

.sidebar-header{padding:14px 14px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.app-brand{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;cursor:pointer;transition:background .15s;margin-bottom:4px}
.app-brand:hover{background:var(--surface3)}
.brand-icon{width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;color:#fff;flex-shrink:0}
.brand-name{font-size:.88rem;font-weight:700;color:var(--text)}
.brand-sub{font-size:.62rem;color:var(--muted)}

.sidebar-nav{padding:6px 8px;display:flex;flex-direction:column;gap:1px}
.nav-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:7px;cursor:pointer;transition:all .15s;font-size:.82rem;font-weight:500;color:var(--muted);min-height:44px}
.nav-item:hover{background:var(--surface3);color:var(--text)}
.nav-item.active{background:var(--accent-bg);color:var(--accent2)}
.nav-item svg{flex-shrink:0;opacity:.7}
.nav-item.active svg{opacity:1}
.nav-badge{margin-left:auto;font-size:.6rem;font-weight:700;padding:1px 6px;border-radius:10px;background:var(--surface3);color:var(--muted)}
.nav-item.active .nav-badge{background:var(--accent-bg);color:var(--accent2)}

.sidebar-section{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px}
.sidebar-section::-webkit-scrollbar{width:3px}
.sidebar-section::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.section-label{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted2);padding:6px 10px 4px;display:flex;align-items:center;justify-content:space-between}
.section-label button{background:none;border:none;color:var(--muted2);cursor:pointer;font-size:.9rem;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:4px}
.channel-item{display:flex;align-items:center;gap:7px;padding:9px 10px;border-radius:7px;cursor:pointer;transition:all .15s;font-size:.79rem;font-weight:500;color:var(--muted);min-height:40px}
.channel-item:hover{background:var(--surface3);color:var(--text)}
.channel-item.active{background:var(--accent-bg);color:var(--text)}
.ch-emoji{font-size:.85rem;width:18px;text-align:center;flex-shrink:0}
.ch-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-count{font-size:.6rem;font-weight:700;padding:1px 6px;border-radius:10px;background:var(--surface3);color:var(--muted);flex-shrink:0}
.channel-item.active .ch-count{background:var(--accent-bg);color:var(--accent2)}

.perf-section{padding:8px;border-top:1px solid var(--border)}
.perf-label{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted2);padding:6px 10px;display:flex;align-items:center;gap:6px}
.perf-mini-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:7px;cursor:pointer;transition:background .15s;min-height:42px}
.perf-mini-item:hover{background:var(--surface3)}
.perf-av-sm{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:700;color:#fff;flex-shrink:0}
.perf-info{flex:1;min-width:0}
.perf-name-sm{font-size:.7rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.perf-score-sm{font-size:.58rem;color:var(--muted)}
.perf-badge-sm{font-size:.58rem;font-weight:700;padding:1px 5px;border-radius:8px;background:var(--green-bg);color:var(--green)}

.sidebar-footer{padding:10px 8px;border-top:1px solid var(--border);flex-shrink:0;padding-bottom:calc(10px + var(--safe-bottom))}

.user-card:hover{background:var(--surface3)}





.theme-switcher{display:flex;gap:4px;padding:8px 0 0;margin-top:8px;border-top:1px solid var(--border)}
.theme-btn{flex:1;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-family:inherit;font-size:.65rem;font-weight:600;cursor:pointer;transition:all .15s;text-transform:uppercase;min-height:38px}
.theme-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
@media(max-width:768px){.main{padding-bottom:calc(var(--bottom-nav-h) + var(--safe-bottom))}}

.topbar{height:var(--header-h);flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:8px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm)}
.topbar-hamburger{display:flex;background:none;border:none;color:var(--muted);cursor:pointer;padding:8px;border-radius:8px;width:40px;height:40px;align-items:center;justify-content:center;transition:all .15s}
.topbar-hamburger:hover{background:var(--surface3);color:var(--text)}
.topbar-channel{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.topbar-emoji{font-size:1rem;flex-shrink:0}
.topbar-title{font-size:.9rem;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-sep{width:1px;height:16px;background:var(--border2);flex-shrink:0;display:none}
@media(min-width:769px){.topbar-sep{display:block}}
.topbar-mode{display:none;gap:2px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:3px}
@media(min-width:769px){.topbar-mode{display:flex}}
.mode-btn{padding:5px 12px;border-radius:6px;border:none;background:transparent;font-family:inherit;font-size:.72rem;font-weight:600;cursor:pointer;color:var(--muted);transition:all .15s;display:flex;align-items:center;gap:5px;white-space:nowrap;min-height:32px}
.mode-btn.active{background:var(--surface3);color:var(--text);box-shadow:var(--shadow-sm)}
.topbar-actions{display:flex;gap:4px;align-items:center;margin-left:auto;flex-shrink:0}
.tb-btn{padding:7px 10px;border-radius:8px;font-family:inherit;font-size:.72rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--muted);transition:all .15s;display:flex;align-items:center;gap:5px;white-space:nowrap;min-height:38px;min-width:38px;justify-content:center}
.tb-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.tb-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tb-btn.primary:hover{filter:brightness(1.1)}
.tb-btn.active-filter{background:var(--accent-bg);border-color:var(--accent);color:var(--accent2)}
.tb-btn .btn-label{display:none}
@media(min-width:480px){.tb-btn .btn-label{display:inline}}

.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:calc(var(--bottom-nav-h) + var(--safe-bottom));background:var(--surface);border-top:1px solid var(--border);z-index:200;padding-bottom:var(--safe-bottom);box-shadow:0 -2px 12px rgba(0,0,0,.08)}
@media(max-width:768px){.bottom-nav{display:flex}}
.bottom-nav-items{display:flex;width:100%;height:var(--bottom-nav-h)}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--muted);padding:4px 2px;position:relative;min-width:0;transition:color .15s}
.bn-item.active{color:var(--accent)}
.bn-label{font-size:.58rem;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bn-badge{position:absolute;top:6px;right:calc(50% - 16px);min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:#fff;font-size:.5rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}

.content{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;background:var(--bg);min-height:0}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

.loader{display:flex;align-items:center;justify-content:center;padding:40px;gap:8px;color:var(--muted);font-size:.8rem}
.spin{width:18px;height:18px;border:2.5px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
.spin-sm{width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted2);padding:40px}
.empty-state h3{font-size:.92rem;font-weight:600;color:var(--muted)}
.empty-state p{font-size:.75rem;text-align:center;max-width:260px;line-height:1.6}

.status-pill{font-size:.6rem;font-weight:700;padding:3px 8px;border-radius:10px;white-space:nowrap;display:inline-block}
.sp-open{background:var(--accent-bg);color:var(--accent2)}
.sp-working{background:var(--orange-bg);color:var(--orange)}
.sp-pending{background:var(--yellow-bg);color:var(--yellow)}
.sp-completed{background:var(--green-bg);color:var(--green)}
.sp-cancelled{background:var(--surface3);color:var(--muted)}
.sp-overdue{background:var(--red-bg);color:var(--red)}
.prio-pill{font-size:.58rem;font-weight:700;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em}
.pp-low{background:var(--green-bg);color:var(--green)}
.pp-medium{background:var(--orange-bg);color:var(--orange)}
.pp-high{background:var(--red-bg);color:var(--red)}
.pp-urgent{background:var(--pink-bg);color:var(--pink)}
.pbadge{font-size:.58rem;font-weight:700;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em}
.pb-low{background:var(--green-bg);color:var(--green)}
.pb-medium{background:var(--orange-bg);color:var(--orange)}
.pb-high{background:var(--red-bg);color:var(--red)}
.pb-urgent{background:var(--pink-bg);color:var(--pink)}
.assigned-chip{display:flex;align-items:center;gap:5px;font-size:.7rem;font-weight:500;color:var(--text)}
.ac-av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.5rem;font-weight:700;color:#fff;flex-shrink:0}
.lt-date{font-size:.67rem;font-weight:600;white-space:nowrap}
.lt-date.overdue,.lt-date.due-today{color:var(--red)}
.lt-date.due-soon{color:var(--orange)}
.lt-date.due-ok{color:var(--green)}

/* TASKS VIEW */
.tasks-view{flex:1;display:flex;flex-direction:column;min-height:0}
.tasks-toolbar{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;background:var(--surface)}
.tasks-view-toggle{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:3px;flex-shrink:0}
.tv-btn{padding:7px 12px;border-radius:6px;border:none;background:transparent;font-family:inherit;font-size:.72rem;font-weight:600;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:4px;min-height:36px;transition:all .15s}
.tv-btn.active{background:var(--surface3);color:var(--text)}
.task-filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto}
.tf-select{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:7px 9px;border-radius:7px;font-family:inherit;font-size:.72rem;outline:none;cursor:pointer;min-height:36px}

.tree-list-wrap{flex:1;overflow-y:auto;padding:12px 14px;min-height:0}
.tree-list-wrap::-webkit-scrollbar{width:3px}
.tree-list-wrap::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

.tree-parent{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;transition:box-shadow .15s,border-color .15s}
.tree-parent:hover{box-shadow:var(--shadow-md)}
.tree-parent.has-sub{border-left:3px solid var(--accent)}

/* ── Card layout: two rows ──
   Row 1: [chevron/spacer]  [title]
   Row 2: [chevron/spacer]  [meta pills]
   Row 3: [chevron/spacer]  [action buttons]
   All three rows share the same left indent so they align.           */
.tree-parent-hd{
  display:grid;
  grid-template-columns:30px 1fr;
  grid-template-rows:auto auto auto;
  column-gap:8px;row-gap:0;
  padding:12px 10px 10px;
  background:var(--surface);cursor:pointer;
  transition:background .15s;user-select:none;
}
.tree-parent-hd:hover{background:var(--surface2)}
.tree-parent-hd:active{background:var(--surface3)}

/* Chevron sits in col-1, row 1, vertically centered to title */
.tree-chevron{
  grid-column:1;grid-row:1;
  width:26px;height:26px;border-radius:7px;
  border:1.5px solid var(--border);background:var(--surface2);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;color:var(--muted);
  align-self:center;justify-self:center;flex-shrink:0;
}
.tree-chevron.open{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.tree-chevron svg{transition:transform .22s}
.tree-chevron.open svg{transform:rotate(90deg)}
.tree-spacer{grid-column:1;grid-row:1;width:26px;height:26px}

/* Info col spans all 3 rows in col-2 */
.tree-parent-info{grid-column:2;grid-row:1/4;display:flex;flex-direction:column;gap:0;min-width:0}

/* Title */
.tree-parent-title{
  font-size:.86rem;font-weight:700;color:var(--text);
  line-height:1.4;margin-bottom:5px;word-break:break-word;
}

/* Meta row: pills */
.tree-parent-meta{
  display:flex;gap:5px;align-items:center;flex-wrap:wrap;
  margin-bottom:8px;
}

/* Actions row: always visible, right-aligned buttons */
.tree-parent-actions{
  display:flex;align-items:center;gap:7px;
}
.tpa-spacer{flex:1;min-width:0}
.sub-count-chip{
  font-size:.62rem;font-weight:700;padding:3px 8px;border-radius:10px;
  background:var(--accent-bg);color:var(--accent2);white-space:nowrap;
  display:inline-flex;align-items:center;gap:3px;
}
/* Big touch-friendly buttons */
.add-sub-btn{
  width:36px;height:36px;min-width:36px;border-radius:9px;
  background:var(--surface2);border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--muted);transition:all .15s;flex-shrink:0;
}
.add-sub-btn:hover,.add-sub-btn:active{background:var(--accent);border-color:var(--accent);color:#fff}
.task-action-btn{
  width:36px;height:36px;min-width:36px;border-radius:9px;
  background:var(--surface2);border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--muted);transition:all .15s;flex-shrink:0;
}
.task-action-btn:hover,.task-action-btn:active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.tree-progress{display:flex;align-items:center;gap:8px;padding:5px 14px 9px 14px}
.tree-progress-bar{flex:1;height:4px;background:var(--surface3);border-radius:2px;overflow:hidden}
.tree-progress-fill{height:100%;border-radius:2px;transition:width .5s;background:linear-gradient(90deg,var(--accent),var(--green))}
.tree-progress-pct{font-size:.6rem;font-weight:700;color:var(--green);white-space:nowrap}
.tree-children{display:none;border-top:1px solid var(--border);background:var(--surface2);flex-direction:column;gap:0}
.tree-children.open{display:flex}
.subtask-row{display:flex;align-items:center;gap:0;padding:9px 14px 9px 0;border-bottom:1px solid var(--border2);cursor:pointer;transition:background .12s;position:relative}
.subtask-row:last-child{border-bottom:none}
.subtask-row:hover{background:var(--surface3)}
.subtask-row:active{background:var(--border2)}
.subtask-indent{width:44px;flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;padding-right:8px}
.subtask-arrow{font-size:.75rem;color:var(--accent);font-family:'Geist Mono',monospace;font-weight:600;line-height:1;opacity:.7}
.sub-status-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;margin-right:8px;font-size:.45rem;color:transparent}
.subtask-row.st-completed .sub-status-dot{background:var(--green);border-color:var(--green);color:#fff}
.subtask-row.st-working .sub-status-dot{border-color:var(--orange);background:var(--orange-bg)}
.subtask-row.st-overdue .sub-status-dot{border-color:var(--red);background:var(--red-bg)}
.subtask-row.st-pending .sub-status-dot{border-color:var(--yellow);background:var(--yellow-bg)}
.subtask-info{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.subtask-title{font-size:.79rem;font-weight:600;color:var(--text);line-height:1.3}
.subtask-row.st-completed .subtask-title{text-decoration:line-through;color:var(--muted)}
.subtask-right{display:flex;align-items:center;gap:6px;flex-shrink:0;padding-right:6px}
.sub-assign-av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.5rem;font-weight:700;color:#fff;flex-shrink:0}
.add-sub-row{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 44px;border-top:1px dashed var(--border);cursor:pointer;transition:background .12s}
.add-sub-row:hover{background:var(--surface3)}
.add-sub-row-icon{width:18px;height:18px;border-radius:4px;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0}
.add-sub-row-label{font-size:.72rem;color:var(--accent2);font-weight:600}

/* KANBAN */
.kanban-wrap{flex:1;overflow-x:auto;overflow-y:hidden;padding:12px 14px;min-height:0;-webkit-overflow-scrolling:touch}
.kanban-wrap::-webkit-scrollbar{height:4px}
.kanban-wrap::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.kanban-board{display:flex;gap:10px;height:100%;align-items:flex-start;min-width:max-content}
.k-col{width:260px;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 200px);box-shadow:var(--shadow-md)}
@media(max-width:480px){.k-col{width:240px}}
.k-col-hd{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-radius:12px 12px 0 0}
.k-col-title{font-size:.75rem;font-weight:700;display:flex;align-items:center;gap:6px}
.k-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.k-cnt{font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--surface2);color:var(--muted)}
.k-cards{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:7px}
.tcard{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;cursor:pointer;transition:all .17s}
.tcard:hover{border-color:var(--accent);box-shadow:var(--shadow-md)}
.tcard:active{transform:scale(.98)}
.tcard.cat-fe{border-left:3px solid var(--accent)}
.tcard.cat-be{border-left:3px solid var(--green)}
.tcard.cat-en{border-left:3px solid var(--orange)}
.tcard.cat-other{border-left:3px solid var(--border)}
.tc-id{font-size:.58rem;color:var(--muted2);font-family:'Geist Mono',monospace;margin-bottom:4px}
.tc-subj{font-size:.78rem;font-weight:600;color:var(--text);line-height:1.35;margin-bottom:8px}
.tc-meta{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tc-user{font-size:.6rem;color:var(--muted);background:var(--surface3);padding:2px 6px;border-radius:4px;border:1px solid var(--border);white-space:nowrap}
.tc-date{font-size:.6rem;padding:2px 6px;border-radius:4px;margin-left:auto;font-weight:600}
.tc-date.overdue,.tc-date.due-today{color:var(--red);background:var(--red-bg)}
.tc-date.due-soon{color:var(--orange);background:var(--orange-bg)}
.tc-date.due-ok{color:var(--green);background:var(--green-bg)}
.empty-col{text-align:center;padding:24px 0;color:var(--muted2);font-size:.72rem}

/* DISCUSSIONS */
.discussions-view{flex:1;display:flex;flex-direction:column;min-height:0}
.disc-filters{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0;background:var(--surface);position:sticky;top:0;z-index:10;overflow-x:auto}
.disc-filters::-webkit-scrollbar{display:none}
.filter-tabs{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:3px;flex-shrink:0}
.ftab{padding:7px 16px;border-radius:6px;border:none;background:transparent;font-family:inherit;font-size:.75rem;font-weight:600;cursor:pointer;color:var(--muted);min-height:36px;white-space:nowrap;transition:all .15s}
.ftab.active{background:var(--surface3);color:var(--text)}
.disc-list{flex:1;overflow-y:auto;min-height:0}
.disc-item{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--border)}
.disc-item:hover{background:var(--surface2)}
.disc-item.unread{background:var(--accent-bg)}
.disc-avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:#fff;margin-top:1px}
.disc-body{flex:1;min-width:0}
.disc-top{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-bottom:3px}
.disc-title{font-size:.82rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.disc-item.unread .disc-title{font-weight:700}
.disc-time{font-size:.62rem;color:var(--muted2);flex-shrink:0}
.disc-meta{font-size:.67rem;color:var(--muted);margin-bottom:3px}
.disc-preview{font-size:.72rem;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disc-foot{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}
.disc-replies{font-size:.62rem;font-weight:600;padding:2px 7px;border-radius:10px;background:var(--surface3);color:var(--muted)}
.disc-tag{font-size:.6rem;font-weight:600;padding:2px 7px;border-radius:10px}

/* DISC DETAIL */
.disc-detail{display:flex;flex-direction:column;height:100%;min-height:0}
.disc-detail-header{padding:12px 14px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.back-btn{display:flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;color:var(--muted);background:none;border:none;cursor:pointer;padding:6px 10px;border-radius:7px;margin-bottom:8px;font-family:inherit;min-height:38px;transition:all .15s}
.back-btn:hover{background:var(--surface3);color:var(--text)}
.disc-detail-title{font-size:1rem;font-weight:800;color:var(--text);line-height:1.35;margin-bottom:8px}
.disc-detail-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ddm-av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:700;color:#fff}
.ddm-author{font-size:.75rem;font-weight:600;color:var(--text)}
.ddm-in{font-size:.72rem;color:var(--muted)}
.ddm-channel{font-size:.72rem;font-weight:600;color:var(--accent2)}
.messages-area{flex:1;overflow-y:auto;padding:12px 14px;padding-bottom:80px;display:flex;flex-direction:column;gap:12px;min-height:0}
.messages-area::-webkit-scrollbar{width:3px}
.messages-area::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;color:#fff;flex-shrink:0;margin-top:2px}
.msg-body{flex:1;min-width:0}
.msg-meta{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.msg-author{font-size:.75rem;font-weight:700;color:var(--text)}
.msg-time{font-size:.62rem;color:var(--muted2)}
.msg-text{font-size:.8rem;color:var(--text);line-height:1.6;background:var(--surface);border:1px solid var(--border);border-radius:0 10px 10px 10px;padding:10px 13px;word-break:break-word}
.msg-text.first-msg{background:var(--surface2)}

/* ══════════════════════════════════════
   COMPOSE AREA WITH ATTACHMENT SUPPORT
══════════════════════════════════════ */
.compose-area{
  padding:0;
  padding-bottom:max(0px,var(--safe-bottom));
  border-top:1px solid var(--border);
  background:var(--surface);
  flex-shrink:0;
  position:sticky;
  bottom:0;
  z-index:20;
}

/* Attachment previews strip */
.attach-preview-strip{
  display:none;
  gap:8px;
  padding:10px 12px 0;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
.attach-preview-strip.has-files{display:flex}
.attach-preview-strip::-webkit-scrollbar{height:3px}
.attach-preview-strip::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* Individual attachment preview thumbnail */
.attach-thumb{
  position:relative;
  flex-shrink:0;
  width:70px;
  height:70px;
  border-radius:10px;
  overflow:visible;
  cursor:pointer;
  border:2px solid var(--border);
  background:var(--surface2);
  display:flex;align-items:center;justify-content:center;
  transition:border-color .15s;
}
.attach-thumb:hover{border-color:var(--accent)}
.attach-thumb img,.attach-thumb video{
  width:100%;height:100%;object-fit:cover;border-radius:8px;
}
.attach-thumb .thumb-overlay{
  position:absolute;inset:0;border-radius:8px;
  background:linear-gradient(to top,rgba(0,0,0,.5) 0%,transparent 60%);
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;
}
.attach-thumb .thumb-label{
  font-size:.5rem;font-weight:700;color:#fff;
  max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;
}
.attach-thumb .thumb-remove{
  position:absolute;top:-7px;right:-7px;
  width:20px;height:20px;border-radius:50%;
  background:var(--red);color:#fff;
  font-size:.65rem;font-weight:800;border:2px solid var(--surface);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:5;transition:all .15s;
  line-height:1;
}
.attach-thumb .thumb-remove:hover{transform:scale(1.15)}

/* PDF / generic file icon */
.attach-thumb .file-icon{
  font-size:1.6rem;flex-shrink:0;
}
.attach-thumb .file-ext-badge{
  position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
  font-size:.48rem;font-weight:800;text-transform:uppercase;
  background:var(--accent);color:#fff;padding:1px 5px;border-radius:4px;
}

/* Video play indicator */
.attach-thumb .video-badge{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
.attach-thumb .video-badge svg{margin-left:2px}

/* Compose input row */
.compose-input-row{
  display:flex;align-items:flex-end;gap:6px;
  padding:8px 10px 10px;
}

/* Attach button (paperclip / + icon) */
.compose-attach-btn{
  width:40px;height:40px;border-radius:50%;
  background:var(--surface2);border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--muted);transition:all .2s;flex-shrink:0;
  position:relative;overflow:hidden;
}
.compose-attach-btn:hover{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.compose-attach-btn input[type=file]{
  position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0;
  width:100%;height:100%;
}

/* Popup attach menu (show on + click for mobile) */
.attach-menu{
  position:absolute;bottom:calc(100% + 8px);left:10px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:8px;
  display:flex;gap:8px;z-index:50;
  box-shadow:var(--shadow-lg);
  animation:slideUp .18s ease;
  display:none;
}
.attach-menu.open{display:flex}
.am-btn{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:10px 14px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--surface2);cursor:pointer;min-width:62px;
  font-size:.62rem;font-weight:700;color:var(--muted);transition:all .15s;
  font-family:inherit;
}
.am-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.am-icon{font-size:1.3rem;line-height:1}

.compose-box{
  flex:1;display:flex;align-items:flex-end;
  background:var(--surface2);border:1.5px solid var(--border2);
  border-radius:22px;padding:8px 12px;transition:border-color .15s;min-width:0;
}
.compose-box:focus-within{border-color:var(--accent)}
.compose-input{flex:1;background:none;border:none;color:var(--text);font-family:inherit;font-size:.82rem;line-height:1.5;resize:none;outline:none;min-height:24px;max-height:120px}
.compose-input::placeholder{color:var(--muted2)}
.compose-send{
  width:40px;height:40px;border-radius:50%;
  background:var(--accent);border:none;color:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .2s;
}
.compose-send:disabled{opacity:.4;cursor:not-allowed}
.compose-send:not(:disabled):hover{transform:scale(1.08);filter:brightness(1.1)}
.compose-send:not(:disabled):active{transform:scale(.93)}

/* Message attachments rendering */
.msg-attachments{
  display:flex;flex-wrap:wrap;gap:6px;
  margin-top:8px;
}
.msg-attach-item{
  position:relative;border-radius:10px;overflow:hidden;
  border:1px solid var(--border);cursor:pointer;
  transition:all .15s;
  background:var(--surface2);
}
.msg-attach-item:hover{border-color:var(--accent);box-shadow:var(--shadow-md)}
/* Images in messages */
.msg-attach-item.type-image{
  max-width:min(260px,100%);
}
.msg-attach-item.type-image img{
  display:block;width:100%;max-width:260px;max-height:200px;
  object-fit:cover;border-radius:9px;
}
/* Video in messages */
.msg-attach-item.type-video{
  max-width:min(260px,100%);
}
.msg-attach-item.type-video video{
  display:block;width:100%;max-width:260px;max-height:200px;
  object-fit:cover;border-radius:9px;
}
/* PDF / doc file pill */
.msg-attach-item.type-file{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  min-width:140px;max-width:260px;
}
.maf-icon{font-size:1.4rem;flex-shrink:0}
.maf-info{flex:1;min-width:0}
.maf-name{font-size:.72rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.maf-size{font-size:.58rem;color:var(--muted);margin-top:1px}
.maf-dl{font-size:.6rem;font-weight:700;color:var(--accent2);margin-top:2px}

/* Image lightbox */
.lightbox{
  display:none;position:fixed;inset:0;z-index:9998;
  background:rgba(0,0,0,.92);backdrop-filter:blur(12px);
  align-items:center;justify-content:center;flex-direction:column;gap:12px;
}
.lightbox.open{display:flex}
.lightbox-img{max-width:92vw;max-height:80vh;border-radius:12px;object-fit:contain;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.lightbox-vid{max-width:92vw;max-height:80vh;border-radius:12px}
.lightbox-close{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;backdrop-filter:blur(6px);transition:all .15s}
.lightbox-close:hover{background:rgba(255,255,255,.28)}
.lightbox-caption{font-size:.75rem;color:rgba(255,255,255,.7);text-align:center;max-width:80vw}

/* Upload progress bar inside message */
.upload-progress-msg{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:0 10px 10px 10px;padding:10px 13px;
  font-size:.78rem;color:var(--muted);margin-top:0;
}
.upload-prog-bar{flex:1;height:4px;background:var(--surface3);border-radius:2px;overflow:hidden}
.upload-prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}

/* PERFORMERS */
.performers-page{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px}
@media(min-width:769px){.performers-page{padding:20px;gap:16px}}
.perf-hero{background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);border-radius:14px;padding:18px 20px;color:#fff;position:relative;overflow:hidden}
.perf-hero::before{content:'🏆';position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:3rem;opacity:.2}
.perf-hero h2{font-size:1.05rem;font-weight:800;margin-bottom:3px}
.perf-hero p{font-size:.74rem;opacity:.85}
.perf-hero-stats{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
.phs-item{text-align:center;min-width:50px}
.phs-num{font-size:1.2rem;font-weight:800}
.phs-label{font-size:.6rem;opacity:.8;text-transform:uppercase;letter-spacing:.05em}
.perf-channel-select{display:flex;gap:6px;flex-wrap:wrap;overflow-x:auto;padding-bottom:4px}
.perf-channel-select::-webkit-scrollbar{display:none}
.perf-channel-btn{padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-family:inherit;font-size:.72rem;font-weight:600;cursor:pointer;white-space:nowrap;min-height:36px;flex-shrink:0;transition:all .15s}
.perf-channel-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.perf-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:600px){.perf-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.perf-grid{grid-template-columns:repeat(3,1fr)}}
.perf-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;position:relative;overflow:hidden;transition:all .17s}
.perf-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.perf-card.rank-1{border-color:var(--gold);border-width:2px}
.perf-card.rank-2{border-color:var(--silver)}
.perf-card.rank-3{border-color:var(--bronze)}
.perf-rank-badge{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:800;color:#fff}
.prb-1{background:var(--gold)}.prb-2{background:var(--silver)}.prb-3{background:var(--bronze)}.prb-other{background:var(--surface3);color:var(--muted)}
.perf-card-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.perf-av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.perf-name{font-size:.85rem;font-weight:700;color:var(--text)}
.perf-email{font-size:.62rem;color:var(--muted);word-break:break-all}
.perf-stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.ps-item{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px;text-align:center}
.ps-num{font-size:1rem;font-weight:800;color:var(--text)}
.ps-label{font-size:.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:1px}
.perf-bar-wrap{margin-top:10px}
.perf-bar-label{display:flex;justify-content:space-between;font-size:.65rem;color:var(--muted);margin-bottom:4px}
.perf-bar{height:6px;background:var(--surface3);border-radius:4px;overflow:hidden}
.perf-bar-fill{height:100%;border-radius:4px;transition:width .5s}
.perf-ontime-chip{display:inline-flex;align-items:center;gap:4px;font-size:.62rem;font-weight:700;padding:3px 8px;border-radius:10px;margin-top:8px;flex-wrap:wrap}

/* ANALYTICS */
.analytics-wrap{flex:1;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
@media(min-width:769px){.analytics-wrap{padding:16px 20px;gap:16px}}
.analytics-header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.analytics-header h2{font-size:.95rem;font-weight:800;color:var(--text);flex:1;min-width:0}
.user-filter-select{background:var(--surface);border:1.5px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-family:inherit;font-size:.75rem;font-weight:600;outline:none;cursor:pointer;min-height:40px;max-width:200px}
.user-filter-select:focus{border-color:var(--accent)}
.analytics-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:600px){.analytics-stats{grid-template-columns:repeat(6,1fr)}}
.astat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 8px;position:relative;overflow:hidden}
.astat::before{content:attr(data-emoji);position:absolute;right:6px;top:6px;font-size:1rem;opacity:.15}
.astat-num{font-size:1.3rem;font-weight:800;line-height:1}
.astat-label{font-size:.58rem;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.05em}
.astat-sub{font-size:.65rem;font-weight:600;margin-top:3px}
.analytics-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;flex:1}
.at-header{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.at-title{font-size:.82rem;font-weight:700;color:var(--text);flex:1;white-space:nowrap}
.at-filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%}
@media(min-width:600px){.at-filters{width:auto}}
.at-filter-select{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:7px 8px;border-radius:7px;font-family:inherit;font-size:.7rem;outline:none;cursor:pointer;min-height:36px;flex:1;min-width:80px}
.at-search{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:7px;font-family:inherit;font-size:.7rem;outline:none;width:100%;min-height:36px}
@media(min-width:600px){.at-search{width:150px}}
.at-search:focus{border-color:var(--accent)}
.at-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.at-table{width:100%;border-collapse:collapse;font-size:.75rem;min-width:600px}
.at-table th{font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted2);padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);background:var(--surface2);white-space:nowrap}
.at-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.at-table tr:hover td{background:var(--surface2);cursor:pointer}
.at-empty{text-align:center;padding:40px;color:var(--muted2);font-size:.8rem}
.at-pagination{padding:10px 12px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:.7rem;color:var(--muted);flex-wrap:wrap;gap:6px}
.pg-btns{display:flex;gap:4px;flex-wrap:wrap}
.pg-btn{padding:5px 11px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-family:inherit;font-size:.68rem;cursor:pointer;min-height:34px;transition:all .15s}
.pg-btn:hover{border-color:var(--accent);color:var(--accent)}
.pg-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:12px}
.modal-overlay.open{display:flex}
@media(max-width:600px){.modal-overlay{align-items:flex-end;padding:0}.modal-box{border-radius:20px 20px 0 0!important;max-height:94vh!important;width:100%!important;max-width:100%!important;border-bottom:none!important}#taskModal{max-height:94vh!important;height:94vh}}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;animation:slideUp .22s ease}
@media(max-width:600px){.modal-box{animation:slideFromBottom .25s cubic-bezier(.4,0,.2,1)}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideFromBottom{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-box::-webkit-scrollbar{width:4px}
.modal-box::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.modal-handle{display:none;width:40px;height:4px;background:var(--border2);border-radius:2px;margin:10px auto 6px;flex-shrink:0}
@media(max-width:600px){.modal-handle{display:block}}
.modal-header{padding:14px 16px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;position:sticky;top:0;background:var(--surface);z-index:2}
.modal-title{font-size:.95rem;font-weight:800;color:var(--text);line-height:1.4;flex:1;margin-right:10px}
.modal-close{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0;transition:all .15s;min-width:32px}
.modal-close:hover{background:var(--red-bg);color:var(--red);border-color:var(--red)}

/* ══════════════════════════════════════
   TASK MODAL — MOBILE FIRST
══════════════════════════════════════ */

/* Override modal-box for task modal: full scroll, no overflow clip */
#taskModal{display:flex;flex-direction:column;max-height:92vh;overflow:hidden}

/* Sticky title header */
.tm-header{
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  padding:14px 16px 10px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--surface);z-index:2;flex-shrink:0;
}
.tm-title{font-size:.95rem;font-weight:800;color:var(--text);line-height:1.4;flex:1}

/* Status bar below header */
.tm-status-bar{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:8px 16px;background:var(--surface2);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.tm-sub-badge{
  font-size:.62rem;font-weight:700;padding:3px 8px;border-radius:10px;
  background:var(--accent-bg);color:var(--accent2);
}

/* Scrollable body */
.tm-body{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:0 0 env(safe-area-inset-bottom,0px);
  -webkit-overflow-scrolling:touch;
}
.tm-body::-webkit-scrollbar{width:3px}
.tm-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* Info grid: 2 columns */
.tm-info-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:0;padding:12px 16px;
  border-bottom:1px solid var(--border2);
}
.tm-info-cell{padding:6px 0}
.tm-info-label{font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted2);margin-bottom:4px}
.tm-info-val{font-size:.8rem;font-weight:600;color:var(--text)}
.tm-info-val.mono{font-family:'Geist Mono',monospace;font-size:.72rem;color:var(--accent2)}

/* Sections (description, subtasks, comments) */
.tm-section{padding:12px 16px;border-bottom:1px solid var(--border2)}
.tm-section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.tm-section-label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted2)}

/* Progress bar */
.tm-progress-bar{height:5px;background:var(--surface3);border-radius:3px;overflow:hidden;margin-bottom:10px}
.tm-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:3px;transition:width .5s}

/* Description box */
.tm-desc{
  background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  padding:10px 12px;font-size:.8rem;line-height:1.6;color:var(--text);
  word-break:break-word;
}

/* Sub-task rows */
.tm-sub-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.tm-sub-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:10px;
  background:var(--surface2);border:1px solid var(--border);
  cursor:pointer;transition:all .15s;min-height:52px;
}
.tm-sub-row:hover,.tm-sub-row:active{border-color:var(--accent);background:var(--accent-bg)}
.tm-sub-row.tm-sub-done{opacity:.7}
.tm-sub-row.tm-sub-overdue{border-color:var(--red-bg)}
.tm-sub-check{
  width:20px;height:20px;border-radius:50%;border:2px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:.5rem;color:transparent;transition:all .2s;
}
.tm-sub-done .tm-sub-check,.tm-sub-checked{background:var(--green)!important;border-color:var(--green)!important;color:#fff!important}
.tm-sub-body{flex:1;min-width:0}
.tm-sub-title{font-size:.82rem;font-weight:600;color:var(--text);line-height:1.3;margin-bottom:4px}
.tm-sub-done .tm-sub-title{text-decoration:line-through;color:var(--muted)}
.tm-sub-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tm-sub-assign{display:flex;align-items:center;gap:4px;font-size:.65rem;color:var(--muted)}

/* Add sub-task button inside section */
.tm-add-sub-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;padding:9px;border-radius:9px;
  border:1.5px dashed var(--border);background:none;
  font-family:inherit;font-size:.75rem;font-weight:600;color:var(--accent2);
  cursor:pointer;transition:all .15s;
}
.tm-add-sub-btn:hover,.tm-add-sub-btn:active{background:var(--accent-bg);border-color:var(--accent)}

/* Action buttons */
.tm-actions{
  display:flex;gap:8px;padding:12px 16px;
  border-bottom:1px solid var(--border2);flex-wrap:wrap;
}
.tm-action-btn{
  flex:1;min-width:80px;padding:11px 10px;border-radius:10px;
  border:1.5px solid var(--border);background:var(--surface2);
  font-family:inherit;font-size:.75rem;font-weight:700;color:var(--muted);
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  transition:all .15s;min-height:44px;
}
.tm-action-btn:hover,.tm-action-btn:active{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.tm-action-btn.tm-action-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tm-action-btn.tm-action-primary:hover{filter:brightness(1.1)}

/* Compose area pinned at bottom of body */
.tm-compose{
  padding:10px 14px;
  border-top:1px solid var(--border);
  background:var(--surface);
  position:sticky;bottom:0;z-index:5;
}
.tm-compose-row{display:flex;align-items:center;gap:7px}
.modal-body{padding:14px 16px 24px}
@media(max-width:600px){.modal-body{padding:14px 14px 32px}}
.form-group{margin-bottom:14px}
.form-label{font-size:.72rem;font-weight:600;color:var(--muted);margin-bottom:6px;display:block}
.form-input,.form-select,.form-textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:.85rem;outline:none;transition:border-color .15s;min-height:44px}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent)}
.form-textarea{min-height:80px;resize:vertical}
.dropdown-list{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:10px;max-height:180px;overflow-y:auto;width:100%;z-index:999;box-shadow:var(--shadow-lg)}
.dropdown-item{padding:10px 12px;cursor:pointer;font-size:.8rem;min-height:40px;display:flex;align-items:center}
.dropdown-item:hover{background:var(--surface3)}
.dropdown-item{flex-direction:column;align-items:flex-start;gap:1px;padding:9px 12px;border-bottom:1px solid var(--border2)}
.dropdown-item:last-child{border-bottom:none}

/* FAB */
.fab{display:none;position:fixed;right:16px;bottom:calc(var(--bottom-nav-h) + var(--safe-bottom) + 12px);width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;border:none;box-shadow:0 4px 16px rgba(79,70,229,.4);cursor:pointer;z-index:150;align-items:center;justify-content:center;font-size:1.4rem;transition:all .2s}
.fab:active{transform:scale(.93)}
@media(max-width:768px){.fab{display:flex}}
</style>
</head>

        <div class="form-group"><label class="form-label">Due Date</label><input type="date" class="form-input" id="newDue"></div>
        <div class="form-group" style="position:relative"><label class="form-label">Assigned To</label><input type="text" class="form-input" id="newAssign" placeholder="Search user…" autocomplete="off"><div id="userDropdown" class="dropdown-list" style="top:100%;left:0;margin-top:2px;display:none"></div></div>

<script>
const API="https://erp.homegeniegroup.in/api/method/Tsg";
let allTasks=[], allProjects=[], allUsers=[], projectsLoaded=false;
let currentChannel="all", currentMode="discussions", taskViewMode="tree";
let discTabFilter="recent", openDiscDetail=null, currentTaskId=null;
let myTasksOnly=false, currentUser=null;
let analyticsPg=1, analyticsPageSize=20;
let analyticsStatusFilter="", analyticsPrioFilter="", analyticsSearch="", analyticsUserFilter="";
let subTaskMap={}, currentSubParentId=null, expandedParents=new Set();
let currentSubEditId=null, currentSubEditParentId=null;
let openDiscTask=null;

// ══════════════════════════════════════
// ATTACHMENT STATE
// ══════════════════════════════════════
// pendingAttachments: array of { file, objectUrl, type:'image'|'video'|'file' }
let pendingAttachments = [];
// attachMenuOpen
let attachMenuOpen = false;

const CHAN_COLORS=["#6366f1","#22c55e","#f97316","#ef4444","#a855f7","#ec4899","#eab308","#06b6d4","#f43f5e","#84cc16"];
const CHAN_EMOJIS={"HR":"👥","FINANCE":"💰","IT":"💻","MARKETING":"📣","PRE SALES":"🎯","PRODUCTION":"⚙️","DELIVERY":"🚀","INSTALLATION":"🔧","PURCHASE":"🛒","SALES":"📈","ALL":"🏠"};

function isMobile(){return window.innerWidth<=768}
function getChanEmoji(n){return CHAN_EMOJIS[n]||"🏷️"}
function initials(n){if(!n)return"?";return n.split(/\s+/).map(w=>w[0]).join("").toUpperCase().slice(0,2)}
function avatarColor(n){return CHAN_COLORS[Math.abs([...(n||"")].reduce((s,c)=>s+c.charCodeAt(0),0))%CHAN_COLORS.length]}
function fmtDate(d){if(!d)return"—";const p=d.split("-");return p.length===3?`${p[2]}-${p[1]}-${p[0]}`:d}
function fmtRelTime(iso){if(!iso)return"";const d=new Date(iso),now=new Date(),diff=Math.floor((now-d)/1000);if(diff<60)return"just now";if(diff<3600)return`${Math.floor(diff/60)}m ago`;if(diff<86400)return`${Math.floor(diff/3600)}h ago`;if(diff<604800)return`${Math.floor(diff/86400)}d ago`;return d.toLocaleDateString()}
function dueDateInfo(dateStr,status){
  if(!dateStr)return null;
  if(status==="Completed"||status==="Cancelled")return{cls:"due-ok",icon:"✓",label:fmtDate(dateStr)};
  const today=new Date();today.setHours(0,0,0,0);
  const due=new Date(dateStr);due.setHours(0,0,0,0);
  const diff=Math.floor((due-today)/(1000*60*60*24));
  if(diff<0)return{cls:"overdue",icon:"⚠",label:fmtDate(dateStr)};
  if(diff===0)return{cls:"due-today",icon:"●",label:fmtDate(dateStr)};
  if(diff<3)return{cls:"due-soon",icon:"◑",label:fmtDate(dateStr)};
  return{cls:"due-ok",icon:"",label:fmtDate(dateStr)}
}
function getCat(s){
  if(!s)return"other";const t=s.trim().toLowerCase();
  if(/front[\s-]?end|frontend|\bui\b|\bux\b|css|html|react|vue/.test(t))return"fe";
  if(/back[\s-]?end|backend|\bapi\b|\bserver\b|database|\bsql\b/.test(t))return"be";
  if(/enabler|infra|devops|pipeline|deploy|docker/.test(t))return"en";
  return"other"
}
function getCSRFToken(){return window.csrf_token||window.frappe?.csrf_token||document.querySelector('meta[name="csrf-token"]')?.getAttribute("content")||document.cookie.split('; ').find(r=>r.startsWith('csrf_token='))?.split('=')[1]}
function getCookie(n){const v=`; ${document.cookie}`;const p=v.split(`; ${n}=`);if(p.length===2)return p.pop().split(';').shift()}

function loadSubTaskCache(){try{const d=localStorage.getItem('tb_subtasks');if(d)subTaskMap=JSON.parse(d);}catch(e){}}
function saveSubTaskCache(){try{localStorage.setItem('tb_subtasks',JSON.stringify(subTaskMap));}catch(e){}}
function getSubTasks(parentId){return subTaskMap[parentId]||[]}
function addSubTask(parentId,sub){if(!subTaskMap[parentId])subTaskMap[parentId]=[];subTaskMap[parentId].push({...sub,id:Date.now()+'_'+Math.random().toString(36).slice(2)});saveSubTaskCache()}
function updateSubTask(parentId,subId,changes){
  const arr=subTaskMap[parentId]||[];
  const idx=arr.findIndex(s=>s.id===subId);
  if(idx>=0){
    arr[idx]={...arr[idx],...changes};
    saveSubTaskCache();
    if(arr[idx].apiName){
      updateSubTaskOnAPI(arr[idx].apiName,changes).catch(e=>console.warn("API subtask update failed",e));
    }
  }
}
async function updateSubTaskOnAPI(taskName,changes){
  try{
    const body={};
    if(changes.status)body.task_status=changes.status;
    if(changes.due)body.todo_date=changes.due;
    if(changes.assignEmail)body.assigned_email=changes.assignEmail;
    await fetch(`/api/resource/Task/${taskName}`,{
      method:"PUT",credentials:"include",
      headers:{"Content-Type":"application/json","X-Frappe-CSRF-Token":getCSRFToken()},
      body:JSON.stringify(body)
    });
  }catch(e){console.warn("updateSubTaskOnAPI error",e);}
}
function deleteSubTask(parentId,subId){
  const arr=subTaskMap[parentId]||[];
  const sub=arr.find(s=>s.id===subId);
  if(subTaskMap[parentId])subTaskMap[parentId]=subTaskMap[parentId].filter(s=>s.id!==subId);
  saveSubTaskCache();
  if(sub&&sub.apiName){
    fetch(`/api/resource/Task/${sub.apiName}`,{
      method:"DELETE",credentials:"include",
      headers:{"X-Frappe-CSRF-Token":getCSRFToken()}
    }).catch(e=>console.warn("API subtask delete failed",e));
  }
}

// THEME
function setTheme(t){document.documentElement.setAttribute('data-theme',t);localStorage.setItem('theme',t);document.querySelectorAll('.theme-btn').forEach(b=>b.classList.remove('active'));document.getElementById('theme'+t.charAt(0).toUpperCase()+t.slice(1))?.classList.add('active')}
function initTheme(){setTheme(localStorage.getItem('theme')||'light')}

// SIDEBAR
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open");document.getElementById("backdrop").classList.toggle("open")}
function closeSidebar(){document.getElementById("sidebar").classList.remove("open");document.getElementById("backdrop").classList.remove("open")}
window.addEventListener("resize",()=>{if(window.innerWidth>768)document.getElementById("backdrop").classList.remove("open")})

function updateBottomNav(mode){
  const map={discussions:"bnDisc",tasks:"bnTasks",performers:"bnPerf",analytics:"bnAnalytics"};
  document.querySelectorAll(".bn-item").forEach(el=>el.classList.remove("active"));
  if(map[mode])document.getElementById(map[mode])?.classList.add("active");
}
function toggleMyTasks(){myTasksOnly=!myTasksOnly;const btn=document.getElementById("myTasksToggle");btn.classList.toggle("active-filter",myTasksOnly);btn.querySelector(".btn-label").textContent=myTasksOnly?"All Tasks":"My Tasks";renderContent()}
function navTo(mode,channel){currentChannel=channel;currentMode=mode;setMode(mode);renderChannelList();if(isMobile())closeSidebar()}
function setMode(mode){
  currentMode=mode;
  ["discussions","tasks","performers","analytics"].forEach(m=>{
    document.getElementById("mode"+m.charAt(0).toUpperCase()+m.slice(1))?.classList.toggle("active",m===mode);
    document.getElementById("nav"+m.charAt(0).toUpperCase()+m.slice(1)+"Btn")?.classList.toggle("active",m===mode);
  });
  openDiscDetail=null;
  const titles={discussions:"Discussions",tasks:"My Tasks",performers:"Top Performers",analytics:"Analytics"};
  const emojis={discussions:"💬",tasks:"📋",performers:"🏆",analytics:"📊"};
  document.getElementById("topbarEmoji").textContent=emojis[mode]||"💬";
  document.getElementById("topbarTitle").textContent=titles[mode]||"";
  updateBottomNav(mode);
  const fab=document.querySelector(".fab");
  if(fab)fab.style.display=mode==="tasks"?"flex":"none";
  renderContent();
}

async function loadProjects(){
  if(projectsLoaded)return;
  const ALLOWED=["HR","FINANCE","IT","MARKETING","PRE SALES","PRODUCTION","DELIVERY","INSTALLATION","PURCHASE","SALES","MAINTENANCE","FACILITY","ADMIN","STORES/INVENTORY","DECISION MAKERS","DECIDERS","QUALITY"];

  // Build the channel list directly from ALLOWED so every channel always
  // shows in the sidebar, regardless of whether a matching Project doctype
  // record exists or whether it currently has any tasks.
  allProjects = ALLOWED.map(label => ({ value: label, label, sub: label }));

  // Optionally still fetch real Project docs in case you want extra
  // metadata later (status/priority), but it no longer gates visibility.
  try{
    const r=await fetch(`${API}?action=get_projects`),j=await r.json();
    const raw=j?.message?.projects||j?.message?.data||[];
    raw.forEach(p=>{
      const label=(p.project_name||p.custom_project_name||p.label||p.project||p.name||"").toUpperCase().trim();
      const match=allProjects.find(x=>x.label===label);
      if(match) match.value = p.project || p.name || match.value; // keep real Frappe project id if it exists
    });
  }catch(e){ /* non-fatal — ALLOWED list still renders */ }

  allProjects.sort((a,b)=>a.label.localeCompare(b.label));
  projectsLoaded=true;
}
async function loadUsers(){
  try{
    const r=await fetch(`${API}?action=get_users&fields=email,full_name,department,designation`),j=await r.json();
    if(!r.ok)throw new Error(`User list request failed (${r.status})`);
    const users=j?.message?.users;
    if(!Array.isArray(users))throw new Error("The server returned no user list.");
    allUsers=users.map(u=>{
      const userId=(u.email||u.name||u.user_id||u.user||"").toString().trim();
      return {...u,email:userId,user_id:userId};
    }).filter(u=>u.user_id);
  }catch(e){
    allUsers=[];
    console.error("Could not load assignees",e);
  }
}

// Build a readable label for a user: "Full Name · Dept" or "Full Name · email"
function userLabel(u){
  const name=u.full_name||u.email||"Unknown";
  const dept=u.department||u.designation||"";
  return dept?`${name} · ${dept}`:name;
}
// Build option text for <select>: "Full Name · Dept (email)"
function userOptionText(u){
  const name=u.full_name||u.email||"Unknown";
  const dept=u.department||u.designation||"";
  const parts=[name];
  if(dept)parts.push(dept);
  return parts.join(" · ");
}
// Search users by name, dept, designation, or email
function searchUsers(val){
  const v=val.toLowerCase().trim();
  if(!v)return[];
  const matches=allUsers.map(u=>{
    const id=(u.user_id||u.email||u.name||"").toString().toLowerCase();
    const name=(u.full_name||"").toString().toLowerCase();
    const department=(u.department||"").toString().toLowerCase();
    const designation=(u.designation||"").toString().toLowerCase();
    const rank=id===v?0:id.startsWith(v)?1:name.startsWith(v)?2:
      (id.includes(v)||name.includes(v)||department.includes(v)||designation.includes(v))?3:99;
    return {user:u,rank};
  }).filter(item=>item.rank<99);
  matches.sort((a,b)=>a.rank-b.rank);
  return matches.slice(0,10).map(item=>item.user);
}
async function fetchData(){
  document.getElementById("content").innerHTML='<div class="loader"><div class="spin"></div> Fetching…</div>';
  try{
    await loadProjects();await loadUsers();
    const r=await fetch(`${API}?action=get&all_data=1`),j=await r.json();
    const rawTasks=(j?.message?.task_data||[]).map(t=>({...t,_cat:getCat(t.subject)}));

    // Separate parent tasks from API-created sub-tasks (those with parent_task field)
    // Merge API sub-tasks into subTaskMap so they show even across devices
    const apiSubTasks=rawTasks.filter(t=>t.parent_task&&t.parent_task!=="");
    const parentTasks=rawTasks.filter(t=>!t.parent_task||t.parent_task==="");

    // Build subTaskMap from API data - these are the "real" subtasks from server
    // Keep locally-created ones that aren't yet in the API (pending sync)
    apiSubTasks.forEach(sub=>{
      const pid=sub.parent_task;
      if(!subTaskMap[pid]) subTaskMap[pid]=[];
      // Check if this API subtask is already tracked locally (by task_id or name match)
      const alreadyTracked=subTaskMap[pid].some(s=>s.apiName===sub.name||s.apiName===sub.task_id);
      if(!alreadyTracked){
        // Add as a tracked subtask with a stable id
        subTaskMap[pid].push({
          id: sub.name||sub.task_id,  // use Frappe name as stable id
          apiName: sub.name||sub.task_id,
          subject: sub.subject||"—",
          status: sub.task_status||"Open",
          priority: sub.task_priority||"Medium",
          due: sub.todo_date||"",
          assignEmail: sub.assigned_email||"",
          assignName: sub.assigned_user_name||"",
          description: sub.task_description||"",
          createdAt: sub.creation||new Date().toISOString(),
          fromAPI: true
        });
      } else {
        // Update existing entry with latest API data
        const idx2=subTaskMap[pid].findIndex(s=>s.apiName===sub.name||s.apiName===sub.task_id);
        if(idx2>=0){
          subTaskMap[pid][idx2]={
            ...subTaskMap[pid][idx2],
            subject: sub.subject||subTaskMap[pid][idx2].subject,
            status: sub.task_status||subTaskMap[pid][idx2].status,
            priority: sub.task_priority||subTaskMap[pid][idx2].priority,
            due: sub.todo_date||subTaskMap[pid][idx2].due,
            assignEmail: sub.assigned_email||subTaskMap[pid][idx2].assignEmail,
            assignName: sub.assigned_user_name||subTaskMap[pid][idx2].assignName,
            fromAPI: true
          };
        }
      }
    });
    saveSubTaskCache();

    // allTasks only shows parent tasks (not sub-tasks as top-level items)
    allTasks=parentTasks;

    const ownerTask=allTasks.find(t=>t.task_owner_name);
    if(ownerTask){currentUser={name:ownerTask.task_owner_name,email:ownerTask.task_owner_email};}
    const tc=allTasks.length;
    document.getElementById("navTaskCount").textContent=tc;document.getElementById("navDiscCount").textContent=allProjects.length;document.getElementById("navAnalyticsCount").textContent=tc;
    if(tc>0){const b=document.getElementById("bnTaskBadge");b.style.display="flex";b.textContent=tc>99?"99+":tc}
    renderChannelList();renderContent();
  }catch(e){document.getElementById("content").innerHTML='<div class="empty-state"><h3>Connection Error</h3><p>Could not reach the API.</p><button class="tb-btn primary" onclick="fetchData()" style="margin-top:8px">Retry</button></div>'}
}

function renderChannelList(){
  const counts={};allTasks.forEach(t=>{const proj=allProjects.find(p=>p.value===t.project);if(proj)counts[proj.label]=(counts[proj.label]||0)+1});
  let html=`<div class="channel-item${currentChannel==="all"?" active":""}" onclick="selectChannel('all','All Channels')"><span class="ch-emoji">🏠</span><span class="ch-name">All Channels</span><span class="ch-count">${allTasks.length}</span></div>`;
  allProjects.forEach(p=>{const cnt=counts[p.label]||0;html+=`<div class="channel-item${currentChannel===p.value?" active":""}" onclick="selectChannel('${p.value}','${p.label}')"><span class="ch-emoji">${getChanEmoji(p.label)}</span><span class="ch-name">${p.label}</span>${cnt?`<span class="ch-count">${cnt}</span>`:""}</div>`});
  document.getElementById("channelList").innerHTML=html;
}
function selectChannel(val,label){currentChannel=val;document.getElementById("topbarEmoji").textContent=val==="all"?"🏠":getChanEmoji(label);document.getElementById("topbarTitle").textContent=label;openDiscDetail=null;renderChannelList();renderContent();if(isMobile())closeSidebar()}
function getFilteredTasks(){
  const norm=v=>(v||"").toString().trim().toUpperCase();
  const allowedNames=allProjects.map(p=>norm(p.label));
  let tasks;
  if(currentChannel==="all")tasks=allTasks.filter(t=>{const n=norm(t.custom_project_name);return n&&allowedNames.includes(n)});
  else{const proj=allProjects.find(p=>p.value===currentChannel);if(!proj)return[];const cn=norm(proj.label);tasks=allTasks.filter(t=>{const n=norm(t.custom_project_name);return n&&n===cn})}
  if(myTasksOnly&&currentUser){const ce=currentUser.email?.toLowerCase();tasks=tasks.filter(t=>(t.task_owner_email||"").toLowerCase()===ce||(t.assigned_email||"").toLowerCase()===ce)}
  return tasks;
}
function renderContent(){
  if(currentMode==="discussions")renderDiscussions();
  else if(currentMode==="tasks")renderTasks();
  else if(currentMode==="performers")renderPerformers();
  else if(currentMode==="analytics")renderAnalytics();
}

// ══════════════════════════════════════
// TASKS — TREE VIEW
// ══════════════════════════════════════
function renderTasks(){
  const tasks=getFilteredTasks();
  const prio=document.querySelector("#prioFilter")?.value||"";
  const filtered=prio?tasks.filter(t=>t.task_priority===prio):tasks;
  let html=`<div class="tasks-view"><div class="tasks-toolbar"><div class="tasks-view-toggle"><button class="tv-btn${taskViewMode==="tree"?" active":""}" onclick="setTaskView('tree')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Tree</button><button class="tv-btn${taskViewMode==="kanban"?" active":""}" onclick="setTaskView('kanban')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="5" height="18" rx="1"/><rect x="10" y="3" width="5" height="18" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg>Kanban</button></div><div class="task-filters"><select class="tf-select" id="prioFilter" onchange="renderTasks()"><option value="">All Priorities</option><option>Low</option><option>Medium</option><option>High</option><option>Urgent</option></select></div></div>`;
  if(taskViewMode==="kanban")html+=renderKanbanInner(filtered);
  else html+=renderTreeInner(filtered);
  html+=`</div>`;
  document.getElementById("content").innerHTML=html;
}
function setTaskView(mode){taskViewMode=mode;renderTasks()}

function renderTreeInner(tasks){
  if(!tasks.length)return`<div class="tree-list-wrap"><div class="empty-state"><h3>No tasks</h3><p>No tasks match the current filters.</p></div></div>`;
  const statusCls=s=>({Open:"sp-open",Working:"sp-working","Pending Review":"sp-pending",Completed:"sp-completed",Cancelled:"sp-cancelled"}[s]||"sp-open");
  const prioCls=p=>`pp-${(p||"medium").toLowerCase()}`;
  const subStatusCls=s=>{if(s==="Completed")return"st-completed";if(s==="Working")return"st-working";if(s==="Pending Review")return"st-pending";return""};
  let html=`<div class="tree-list-wrap">`;
  tasks.forEach(t=>{
    const pid=t.name||t.task_id;const subs=getSubTasks(pid);const hasSubs=subs.length>0;const isExpanded=expandedParents.has(pid);
    const ddi=dueDateInfo(t.todo_date,t.task_status);const completedSubs=subs.filter(s=>s.status==="Completed").length;const pct=hasSubs?Math.round((completedSubs/subs.length)*100):0;
    html+=`<div class="tree-parent${hasSubs?" has-sub":""}" id="tp_${pid}"><div class="tree-parent-hd" onclick="handleParentClick(event,'${pid}')">`;
    if(hasSubs)html+=`<div class="tree-chevron${isExpanded?" open":""}" id="chv_${pid}" onclick="event.stopPropagation();toggleExpand('${pid}')"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 18l6-6-6-6"/></svg></div>`;
    else html+=`<div class="tree-spacer"></div>`;
    html+=`<div class="tree-parent-info">
        <div class="tree-parent-title">${t.subject||"—"}</div>
        <div class="tree-parent-meta">
          <span class="status-pill ${statusCls(t.task_status)}">${t.task_status||"Open"}</span>
          <span class="prio-pill ${prioCls(t.task_priority)}">${t.task_priority||"Medium"}</span>
          ${t.assigned_user_name?`<span style="font-size:.67rem;color:var(--muted);display:inline-flex;align-items:center;gap:3px">
            <div class="sub-assign-av" style="background:${avatarColor(t.assigned_user_name)}">${initials(t.assigned_user_name)}</div>
            ${t.assigned_user_name.split(" ")[0]}</span>`:""}
          ${ddi?`<span class="lt-date ${ddi.cls}" style="font-size:.62rem">${ddi.label}</span>`:""}
        </div>
        <div class="tree-parent-actions">
          <span class="tpa-spacer"></span>
          ${hasSubs?`<span class="sub-count-chip">⤵ ${subs.length} sub${subs.length>1?"s":""}</span>`:""}
          <div class="add-sub-btn" title="Add sub-task" onclick="event.stopPropagation();openSubtaskModal('${pid}','${(t.subject||"").replace(/'/g,"\\\\'")}')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          </div>
          <div class="task-action-btn" title="View / Edit" onclick="event.stopPropagation();openTaskModal(${allTasks.indexOf(t)})">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          </div>
        </div>
      </div></div>`;
    if(hasSubs)html+=`<div class="tree-progress"><div class="tree-progress-bar"><div class="tree-progress-fill" style="width:${pct}%"></div></div><span class="tree-progress-pct">${pct}%</span></div>`;
    if(hasSubs){
      html+=`<div class="tree-children${isExpanded?" open":""}" id="tc_${pid}">`;

// ── Modal attachment state (separate from discussion compose) ──
let modalPendingAttachments = [];
let modalAttachMenuOpen = false;

function toggleModalAttachMenu(e){
  e.stopPropagation();
  const menu=document.getElementById("mmAttachMenu");
  if(!menu)return;
  modalAttachMenuOpen=!modalAttachMenuOpen;
  menu.classList.toggle("open",modalAttachMenuOpen);
}
function closeModalAttachMenu(){
  const menu=document.getElementById("mmAttachMenu");
  if(menu)menu.classList.remove("open");
  modalAttachMenuOpen=false;
}
function handleModalFileInput(event,hintType){
  closeModalAttachMenu();
  const files=Array.from(event.target.files||[]);
  files.forEach(file=>{
    const type=getFileType(file);
    const objectUrl=URL.createObjectURL(file);
    modalPendingAttachments.push({file,objectUrl,type,id:Date.now()+'_'+Math.random().toString(36).slice(2)});
  });
  event.target.value="";
  renderModalAttachPreview();
}
function renderModalAttachPreview(){
  const strip=document.getElementById("mmAttachStrip");
  if(!strip)return;
  if(!modalPendingAttachments.length){strip.classList.remove("has-files");strip.innerHTML="";return;}
  strip.classList.add("has-files");
  strip.innerHTML=modalPendingAttachments.map(a=>{
    if(a.type==="image"){
      return`<div class="attach-thumb"><img src="${a.objectUrl}" alt="${a.file.name}" onclick="openLightboxFromThumb('${a.objectUrl}','${a.file.name}','image')"><div class="thumb-overlay"><div class="thumb-label">${a.file.name}</div></div><div class="thumb-remove" onclick="removeModalAttachment('${a.id}')">&#x2715;</div></div>`;
    }
    if(a.type==="video"){
      return`<div class="attach-thumb"><video src="${a.objectUrl}" muted playsinline preload="metadata" style="pointer-events:none"></video><div class="video-badge"><svg width="10" height="10" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg></div><div class="thumb-remove" onclick="removeModalAttachment('${a.id}')">&#x2715;</div></div>`;
    }
    const ext=a.file.name.split(".").pop().toUpperCase();
    return`<div class="attach-thumb"><div class="file-icon">${getFileIcon(a.file.name)}</div><div class="file-ext-badge">${ext}</div><div class="thumb-remove" onclick="removeModalAttachment('${a.id}')">&#x2715;</div></div>`;
  }).join("");
}
function removeModalAttachment(id){
  const att=modalPendingAttachments.find(a=>a.id===id);
  if(att)URL.revokeObjectURL(att.objectUrl);
  modalPendingAttachments=modalPendingAttachments.filter(a=>a.id!==id);
  renderModalAttachPreview();
}
function clearModalAttachments(){
  modalPendingAttachments.forEach(a=>URL.revokeObjectURL(a.objectUrl));
  modalPendingAttachments=[];
}

async function sendModalComment(){
  const inp=document.getElementById("mmInput");
  const text=(inp?.value||"").trim();
  const hasAttach=modalPendingAttachments.length>0;
  if(!text&&!hasAttach)return;
  if(!currentTaskId)return;

  const sendBtn=document.getElementById("mmSendBtn");
  if(inp)inp.disabled=true;
  if(sendBtn){sendBtn.disabled=true;sendBtn.innerHTML='<div class="spin-sm"></div>';}

  const attachSnapshot=[...modalPendingAttachments];
  clearModalAttachments();
  renderModalAttachPreview();

  try{
    // 1. Upload files if any
    const uploadedFileDocs=[];
    for(let i=0;i<attachSnapshot.length;i++){
      const a=attachSnapshot[i];
      try{
        const result=await uploadFileToFrappe(a.file,currentTaskId);
        const fileUrl=result.file_url||result.url||"";
        uploadedFileDocs.push({fileDocName:result.name||"",file_url:fileUrl,file_name:result.file_name||a.file.name,type:a.type||detectFileType(fileUrl),size:formatFileSize(a.file.size)});
      }catch(err){
        console.warn("Upload error",err);
        uploadedFileDocs.push({fileDocName:"",file_url:a.objectUrl,file_name:a.file.name,type:a.type,size:formatFileSize(a.file.size)});
      }
    }

    // 2. Post comment using correct CSRF token
    const commentContent=text||(uploadedFileDocs.length?"📎 "+uploadedFileDocs.length+" attachment"+(uploadedFileDocs.length>1?"s":""):"-");
    const res=await fetch("/api/resource/Communication",{
      method:"POST",credentials:"include",
      headers:{"Content-Type":"application/json","X-Frappe-CSRF-Token":getCSRFToken(),"Accept":"application/json"},
      body:JSON.stringify({doctype:"Communication",communication_type:"Comment",reference_doctype:"Task",reference_name:currentTaskId,subject:"Comment",content:commentContent})
    });
    const data=await res.json();
    if(!res.ok){
      let errMsg="Server error";
      if(data?._server_messages){
        try{const msgs=JSON.parse(data._server_messages);errMsg=JSON.parse(msgs[0]).message||errMsg;}catch(ex){}
      } else if(data?.message){errMsg=typeof data.message==="string"?data.message:JSON.stringify(data.message);}
      else if(data?.exc_type){errMsg=data.exc_type;}
      throw new Error(errMsg);
    }

    // 3. Link uploaded files to Communication doc
    const commName=data?.data?.name||data?.name||"";
    if(commName){
      for(const f of uploadedFileDocs){
        if(f.fileDocName) await linkFileToCommunication(f.fileDocName,commName);
      }
    }

    if(inp){inp.value="";}
    await loadComments(currentTaskId,document.getElementById("mmList"));
    setTimeout(()=>{const mb=document.querySelector("#taskModal .modal-body");if(mb)mb.scrollTop=mb.scrollHeight;},100);

  }catch(e){
    console.error("sendModalComment error",e);
    alert("Could not post comment: "+e.message);
  }

  if(inp)inp.disabled=false;
  if(sendBtn){sendBtn.disabled=false;sendBtn.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>';}
}

function getFileType(file){
  if(file.type.startsWith("image/"))return"image";
  if(file.type.startsWith("video/"))return"video";
  return"file";
}

function getFileIcon(name){
  const ext=(name||"").split(".").pop().toLowerCase();
  const icons={pdf:"📕",doc:"📘",docx:"📘",xls:"📗",xlsx:"📗",ppt:"📙",pptx:"📙",txt:"📄",csv:"📊"};
  return icons[ext]||"📎";
}

function formatFileSize(bytes){
  if(bytes<1024)return bytes+"B";
  if(bytes<1024*1024)return(bytes/1024).toFixed(1)+"KB";
  return(bytes/(1024*1024)).toFixed(1)+"MB";
}

function handleFileInput(event, hintType){
  closeAttachMenu();
  const files=Array.from(event.target.files||[]);
  files.forEach(file=>{
    const type=getFileType(file);
    const objectUrl=URL.createObjectURL(file);
    pendingAttachments.push({file, objectUrl, type, id: Date.now()+'_'+Math.random().toString(36).slice(2)});
  });
  event.target.value=""; // reset so same file can be re-added
  renderAttachPreview();
  // Show send button active if attachments
  updateSendBtnState();
}

function renderAttachPreview(){
  const strip=document.getElementById("attachPreviewStrip");
  if(!strip)return;
  if(!pendingAttachments.length){strip.classList.remove("has-files");strip.innerHTML="";return;}
  strip.classList.add("has-files");
  strip.innerHTML=pendingAttachments.map(a=>{
    if(a.type==="image"){
      return`<div class="attach-thumb" id="at_${a.id}">
        <img src="${a.objectUrl}" alt="${a.file.name}" onclick="openLightboxFromThumb('${a.objectUrl}','${a.file.name}','image')">
        <div class="thumb-overlay"><div class="thumb-label">${a.file.name}</div></div>
        <div class="thumb-remove" onclick="removeAttachment('${a.id}')">✕</div>
      </div>`;
    }
    if(a.type==="video"){
      return`<div class="attach-thumb" id="at_${a.id}">
        <video src="${a.objectUrl}" muted playsinline preload="metadata" style="pointer-events:none"></video>
        <div class="thumb-overlay"><div class="thumb-label">${a.file.name}</div></div>
        <div class="video-badge"><svg width="10" height="10" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
        <div class="thumb-remove" onclick="removeAttachment('${a.id}')">✕</div>
      </div>`;
    }

    return`<div class="attach-thumb" id="at_${a.id}">
      <div class="file-icon">${getFileIcon(a.file.name)}</div>
      <div class="file-ext-badge">${ext}</div>
      <div class="thumb-remove" onclick="removeAttachment('${a.id}')">✕</div>
    </div>`;
  }).join("");
}

function removeAttachment(id){
  const att=pendingAttachments.find(a=>a.id===id);
  if(att)URL.revokeObjectURL(att.objectUrl);
  pendingAttachments=pendingAttachments.filter(a=>a.id!==id);
  renderAttachPreview();
  updateSendBtnState();
}

function clearPendingAttachments(){
  pendingAttachments.forEach(a=>URL.revokeObjectURL(a.objectUrl));
  pendingAttachments=[];
}

function updateSendBtnState(){
  const btn=document.getElementById("discSendBtn");
