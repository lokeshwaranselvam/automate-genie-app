// ── Upload a file to Frappe and link it to a Communication doc ──
// Step 1: upload_file (links to Task)
// Step 2: re-attach it to the Communication record so we can query by comm name
async function uploadFileToFrappe(file, taskId){
  const fd=new FormData();
  fd.append("file", file, file.name);
  fd.append("is_private","0");
  fd.append("doctype","Task");
  fd.append("docname", taskId);
  const res=await fetch("/api/method/upload_file",{
    method:"POST",credentials:"include",
    headers:{"X-Frappe-CSRF-Token":getCSRFToken()||getCookie("csrf_token")},
    body:fd
  });
  if(!res.ok) throw new Error("Upload failed");
  const data=await res.json();
  return data.message||data; // { file_url, name, file_name, ... }
}

// Re-attach uploaded file to a Communication doc
async function linkFileToCommunication(fileDocName, commName){
  try{
    await fetch(`/api/resource/File/${fileDocName}`,{
      method:"PUT",credentials:"include",
      headers:{"Content-Type":"application/json","X-Frappe-CSRF-Token":getCSRFToken()||getCookie("csrf_token")},
      body:JSON.stringify({attached_to_doctype:"Communication",attached_to_name:commName})
    });
  }catch(e){ /* non-fatal */ }
}

// Detect file type from URL / filename
function detectFileType(url){
  const u=(url||"").toLowerCase().split("?")[0];
  if(/\.(jpg|jpeg|png|gif|webp|bmp|svg)$/.test(u))return"image";
  if(/\.(mp4|mov|webm|ogg|avi|mkv)$/.test(u))return"video";
  return"file";
}

      </div>
    </div>`;
  }).join("")}</div>`;
}

// Fetch files attached to a list of Communication doc names
async function fetchCommFiles(commNames){
  // Returns map: { commName: [ {file_url, file_name, ...} ] }
  if(!commNames.length)return{};
  try{
    const filters=JSON.stringify([
      ["attached_to_doctype","=","Communication"],
      ["attached_to_name","in",commNames]
    ]);
    const fields=JSON.stringify(["name","file_url","file_name","attached_to_name","file_size"]);
    const url=`/api/resource/File?filters=${encodeURIComponent(filters)}&fields=${encodeURIComponent(fields)}&limit_page_length=200`;
    const r=await fetch(url,{credentials:"include"});
    if(!r.ok)return{};
    const d=await r.json();
    const map={};
    (d.data||[]).forEach(f=>{
      const k=f.attached_to_name;
      if(!map[k])map[k]=[];
      map[k].push(f);
    });
    return map;
  }catch(e){return{}}
}

// Also fetch files linked directly to the Task (for older uploads done before comm linking)
async function fetchTaskFiles(taskId){
  try{
    const filters=JSON.stringify([
      ["attached_to_doctype","=","Task"],
      ["attached_to_name","=",taskId]
    ]);
    const fields=JSON.stringify(["name","file_url","file_name","creation","file_size"]);
    const url=`/api/resource/File?filters=${encodeURIComponent(filters)}&fields=${encodeURIComponent(fields)}&limit_page_length=200&order_by=creation%20asc`;
    const r=await fetch(url,{credentials:"include"});
    if(!r.ok)return[];
    const d=await r.json();
    return d.data||[];
  }catch(e){return[]}
}

// Parse legacy embedded attachment metadata from comment content (backward compat)
function parseCommentContent(rawContent){
  const attachRegex=/<!-- ATTACH:([A-Za-z0-9+/=]+) -->/g;
  let match; const attachments=[];
  let cleanContent=rawContent;
  while((match=attachRegex.exec(rawContent))!==null){
    try{const decoded=JSON.parse(atob(match[1]));if(Array.isArray(decoded))attachments.push(...decoded)}catch(e){}
    cleanContent=cleanContent.replace(match[0],"");
  }
  return{cleanContent:cleanContent.trim(),attachments};
}

async function sendDiscComment(){
  const inp=document.getElementById("discCompose");
  const text=(inp?.value||"").trim();
  const hasAttach=pendingAttachments.length>0;
  if(!text&&!hasAttach)return;
  if(!currentTaskId)return;
  const btn=document.getElementById("discSendBtn");
  if(btn){btn.disabled=true;btn.innerHTML='<div class="spin-sm"></div>';}

  const attachSnapshot=[...pendingAttachments];
  clearPendingAttachments();
  renderAttachPreview();

  try{
    // 1. Show uploading indicator
    const commentsEl=document.getElementById("commentsArea");
    if(attachSnapshot.length&&commentsEl){
      const pendingEl=document.createElement("div");
      pendingEl.className="msg";pendingEl.id="pendingMsg";
      pendingEl.innerHTML=`<div class="msg-av" style="background:${avatarColor(currentUser?.name||'You')}">${initials(currentUser?.name||'Y')}</div>
        <div class="msg-body">
          <div class="msg-meta"><span class="msg-author">${currentUser?.name||'You'}</span><span class="msg-time">Uploading…</span></div>
          <div class="upload-progress-msg">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;color:var(--accent)"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <div style="flex:1">
              <div style="font-size:.7rem;margin-bottom:4px">Uploading ${attachSnapshot.length} file${attachSnapshot.length>1?"s":""}…</div>
              <div class="upload-prog-bar"><div class="upload-prog-fill" id="uploadProgFill" style="width:5%"></div></div>
            </div>
          </div>
        </div>`;
      commentsEl.appendChild(pendingEl);
      const msgs=document.getElementById("detailMsgs");if(msgs)msgs.scrollTop=msgs.scrollHeight;
    }

    // 2. Upload files (linked to Task for now)
    const uploadedFileDocs=[]; // { fileDocName, file_url, file_name, type, size }
    for(let i=0;i<attachSnapshot.length;i++){
      const a=attachSnapshot[i];
      try{
        const result=await uploadFileToFrappe(a.file,currentTaskId);
        const fileUrl=result.file_url||result.url||"";
        uploadedFileDocs.push({
          fileDocName:result.name||"",
          file_url: fileUrl,
          file_name: result.file_name||a.file.name,
          type: a.type||detectFileType(fileUrl),
          size: formatFileSize(a.file.size)
        });
      }catch(err){
        console.warn("Upload error",err);
        // show locally with objectUrl as fallback (session only)
        uploadedFileDocs.push({fileDocName:"",file_url:a.objectUrl,file_name:a.file.name,type:a.type,size:formatFileSize(a.file.size)});
      }
      const fill=document.getElementById("uploadProgFill");
      if(fill)fill.style.width=`${Math.round(((i+1)/attachSnapshot.length)*95)}%`;
    }
    document.getElementById("pendingMsg")?.remove();

    // 3. Post the comment (text only; files are linked separately)
    const commentContent=text||(uploadedFileDocs.length?`📎 ${uploadedFileDocs.length} attachment${uploadedFileDocs.length>1?"s":""}`:"-");
    const res=await fetch("/api/resource/Communication",{
      method:"POST",credentials:"include",
      headers:{"Content-Type":"application/json","X-Frappe-CSRF-Token":getCSRFToken(),"Accept":"application/json"},
      body:JSON.stringify({doctype:"Communication",communication_type:"Comment",reference_doctype:"Task",reference_name:currentTaskId,subject:"Comment",content:commentContent})
    });
    if(res.ok){
      const commData=await res.json();
      const commName=commData?.data?.name||commData?.name||"";

      // 4. Re-link each uploaded file to the Communication doc so we can fetch them back
      if(commName){
        for(const f of uploadedFileDocs){
          if(f.fileDocName) await linkFileToCommunication(f.fileDocName, commName);
        }
      }

      if(inp){inp.value="";inp.style.height="auto";}
      await loadComments(currentTaskId,document.getElementById("commentsArea"));
      const msgs=document.getElementById("detailMsgs");if(msgs)msgs.scrollTop=msgs.scrollHeight;
    }else{
      alert("Could not post comment");
    }
  }catch(e){console.error(e);alert("Network error")}

  if(btn){btn.disabled=false;btn.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>';}
  updateSendBtnState();
}

async function loadComments(taskId,el){
  if(!el)return;
  try{
    // 1. Fetch comments
    const url=`/api/resource/Communication?filters=${encodeURIComponent(JSON.stringify([["reference_doctype","=","Task"],["reference_name","=",taskId],["communication_type","=","Comment"]]))}&fields=${encodeURIComponent(JSON.stringify(["name","content","owner","sender_full_name","creation"]))}&order_by=creation%20asc&limit_page_length=50`;
    const r=await fetch(url,{credentials:"include"});
    const d=await r.json();
    const comments=d?.data||[];

    if(!comments.length){
      el.innerHTML='<div style="color:var(--muted2);font-size:.72rem;text-align:center;padding:16px">No comments yet.</div>';
      return;
    }

    // 2. Fetch files attached to all these Communication docs in one request
    const commNames=comments.map(c=>c.name).filter(Boolean);
    const commFilesMap=await fetchCommFiles(commNames);

    // 3. Render
    el.innerHTML=comments.map(c=>{
      const name=c.sender_full_name||c.owner||"Unknown";
      const col=avatarColor(name);
      const rawText=(c.content||"").replace(/<br\s*\/?>/gi,"\n").replace(/<[^>]+>/g,"").trim();
      const {cleanContent,attachments:legacyAttach}=parseCommentContent(rawText);

      // Files linked to this specific Communication doc
      const commFiles=(commFilesMap[c.name]||[]).map(f=>({
        url: f.file_url,
        name: f.file_name||f.file_url?.split("/").pop()||"file",
        type: detectFileType(f.file_url),
        size: f.file_size ? formatFileSize(f.file_size) : ""
      }));

      // Merge: comm-linked files take priority; legacy embedded are fallback
      const allAttachments=[...commFiles, ...legacyAttach];

      const attachHTML=buildAttachmentHTML(allAttachments);

      // Clean up the auto-generated "📎 N attachment(s)" text if real files are shown
      let displayText=cleanContent;
      if(allAttachments.length&&/^📎\s*\d+\s*attachment/.test(displayText)) displayText="";

      return`<div class="msg">
        <div class="msg-av" style="background:${col}">${initials(name)}</div>
        <div class="msg-body">
          <div class="msg-meta"><span class="msg-author">${name}</span><span class="msg-time">${fmtRelTime(c.creation)}</span></div>
          ${displayText?`<div class="msg-text">${displayText.replace(/\n/g,"<br/>")}</div>`:""}
          ${attachHTML}
        </div>
      </div>`;
    }).join("");
  }catch(e){
    console.error("loadComments error",e);
    el.innerHTML='<div style="color:var(--muted2);font-size:.72rem;text-align:center;padding:16px">Comments unavailable</div>';
  }
}

function computePerformers(channel){
  const norm=v=>(v||"").toString().trim().toUpperCase();let tasks=allTasks;
  if(channel!=="all"){const proj=allProjects.find(p=>p.value===channel);if(proj){const cn=norm(proj.label);tasks=tasks.filter(t=>norm(t.custom_project_name)===cn)}}
  else{const allowed=allProjects.map(p=>norm(p.label));tasks=tasks.filter(t=>{const n=norm(t.custom_project_name);return n&&allowed.includes(n)})}
  const map={};
  tasks.forEach(t=>{const email=t.assigned_email||t.task_owner_email||"unknown",name=t.assigned_user_name||t.task_owner_name||email;if(!map[email])map[email]={email,name,total:0,completed:0,onTime:0,overdue:0,open:0,working:0};map[email].total++;const ddi=dueDateInfo(t.todo_date,t.task_status);if(t.task_status==="Completed"){map[email].completed++;if(ddi&&ddi.cls==="due-ok")map[email].onTime++}else if(ddi&&ddi.cls==="overdue")map[email].overdue++;else if(t.task_status==="Working")map[email].working++;else map[email].open++});
  return Object.values(map).filter(u=>u.total>0).map(u=>({...u,score:u.onTime*3+u.completed*2-u.overdue,rate:u.total?Math.round(u.completed/u.total*100):0})).sort((a,b)=>b.score-a.score||b.completed-a.completed);
}
function renderSidebarPerformers(){const perf=computePerformers("all").slice(0,3),sec=document.getElementById("perfMiniSection");if(!perf.length){sec.style.display="none";return}sec.style.display="block";document.getElementById("perfMiniList").innerHTML=perf.map((p,i)=>`<div class="perf-mini-item" onclick="navTo('performers','all')"><span style="font-size:.6rem;font-weight:800;width:14px;text-align:center;color:${i===0?"var(--gold)":i===1?"var(--silver)":"var(--bronze)"}">${["🥇","🥈","🥉"][i]}</span><div class="perf-av-sm" style="background:${avatarColor(p.name)}">${initials(p.name)}</div><div class="perf-info"><div class="perf-name-sm">${p.name.split(" ")[0]}</div><div class="perf-score-sm">${p.completed} done · ${p.onTime} on-time</div></div><span class="perf-badge-sm">${p.rate}%</span></div>`).join("")}
function renderPerformers(){
  const tasks=getFilteredTasks(),perf=computePerformers(currentChannel);
  const totalDone=perf.reduce((s,p)=>s+p.completed,0),totalOnTime=perf.reduce((s,p)=>s+p.onTime,0);
  let html=`<div class="performers-page"><div class="perf-hero"><h2>🏆 Top Performers</h2><p>Ranked by all tasks completed on time</p><div class="perf-hero-stats"><div class="phs-item"><div class="phs-num">${perf.length}</div><div class="phs-label">Members</div></div><div class="phs-item"><div class="phs-num">${totalDone}</div><div class="phs-label">Done</div></div><div class="phs-item"><div class="phs-num">${totalOnTime}</div><div class="phs-label">On-Time</div></div><div class="phs-item"><div class="phs-num">${tasks.length}</div><div class="phs-label">Total</div></div></div></div><div class="perf-channel-select"><button class="perf-channel-btn${currentChannel==="all"?" active":""}" onclick="setPerfCh('all')">🏠 All</button>${allProjects.map(p=>`<button class="perf-channel-btn${currentChannel===p.value?" active":""}" onclick="setPerfCh('${p.value}')">${getChanEmoji(p.label)} ${p.label}</button>`).join("")}</div><div class="perf-grid">${perf.length?perf.map((p,i)=>{const rnk=i+1,pct=p.total?Math.round(p.onTime/p.total*100):0,oc=pct>=80?"var(--green)":pct>=50?"var(--orange)":"var(--red)";return`<div class="perf-card${rnk<=3?" rank-"+rnk:""}" onclick="filterAnalyticsByUser('${p.email}')"><div class="perf-rank-badge ${rnk===1?"prb-1":rnk===2?"prb-2":rnk===3?"prb-3":"prb-other"}">${rnk<=3?"":rnk}</div><div class="perf-card-top"><div class="perf-av" style="background:${avatarColor(p.name)}">${initials(p.name)}</div><div><div class="perf-name">${p.name}</div><div class="perf-email">${p.email}</div></div></div><div class="perf-stats-row"><div class="ps-item"><div class="ps-num">${p.total}</div><div class="ps-label">Total</div></div><div class="ps-item"><div class="ps-num" style="color:var(--green)">${p.completed}</div><div class="ps-label">Done</div></div><div class="ps-item"><div class="ps-num" style="color:var(--red)">${p.overdue}</div><div class="ps-label">OVD</div></div></div><div class="perf-bar-wrap"><div class="perf-bar-label"><span>On-time</span><span style="color:${oc};font-weight:700">${pct}%</span></div><div class="perf-bar"><div class="perf-bar-fill" style="width:${pct}%;background:${oc}"></div></div></div><span class="perf-ontime-chip" style="background:${oc}18;color:${oc}">✓ ${p.onTime} on-time · ${p.open} open</span></div>`}).join(""):`<div class="empty-state" style="grid-column:1/-1"><h3>No data</h3></div>`}</div></div>`;
  document.getElementById("content").innerHTML=html;
}

  const allF=getFilteredTasks();const total=allF.length,completed=allF.filter(t=>t.task_status==="Completed").length;const open=allF.filter(t=>t.task_status==="Open").length,working=allF.filter(t=>t.task_status==="Working").length;const overdue=allF.filter(t=>{const d=dueDateInfo(t.todo_date,t.task_status);return d&&d.cls==="overdue"}).length;const ontime=allF.filter(t=>{if(t.task_status!=="Completed")return false;const d=dueDateInfo(t.todo_date,t.task_status);return d&&d.cls==="due-ok"}).length;const userMap={};allF.forEach(t=>{if(t.assigned_email&&t.assigned_user_name)userMap[t.assigned_email]=t.assigned_user_name;if(t.task_owner_email&&t.task_owner_name)userMap[t.task_owner_email]=t.task_owner_name});const userOpts=Object.entries(userMap).map(([e,n])=>`<option value="${e}" ${analyticsUserFilter===e?"selected":""}>${n}</option>`).join("");let filtered=allF;if(analyticsUserFilter)filtered=filtered.filter(t=>(t.assigned_email||"")==analyticsUserFilter||(t.task_owner_email||"")==analyticsUserFilter);if(analyticsStatusFilter)filtered=filtered.filter(t=>t.task_status===analyticsStatusFilter);if(analyticsPrioFilter)filtered=filtered.filter(t=>t.task_priority===analyticsPrioFilter);if(analyticsSearch){const s=analyticsSearch.toLowerCase();filtered=filtered.filter(t=>(t.subject||"").toLowerCase().includes(s)||(t.task_id||"").toLowerCase().includes(s))}const totalPgs=Math.max(1,Math.ceil(filtered.length/analyticsPageSize));analyticsPg=Math.min(analyticsPg,totalPgs);const paginated=filtered.slice((analyticsPg-1)*analyticsPageSize,analyticsPg*analyticsPageSize);const selectedUser=analyticsUserFilter?userMap[analyticsUserFilter]||analyticsUserFilter:"";let pgBtns="";for(let i=1;i<=Math.min(totalPgs,7);i++)pgBtns+=`<button class="pg-btn${i===analyticsPg?" active":""}" onclick="setAnalyticsPg(${i})">${i}</button>`;

eted</option><option value="Cancelled" ${analyticsStatusFilter==="Cancelled"?"selected":""}>Cancelled</option></select><select class="at-filter-select" onchange="setAnalyticsPrio(this.value)"><option value="">All Priority</option><option value="Low" ${analyticsPrioFilter==="Low"?"selected":""}>Low</option><option value="Medium" ${analyticsPrioFilter==="Medium"?"selected":""}>Medium</option><option value="High" ${analyticsPrioFilter==="High"?"selected":""}>High</option><option value="Urgent" ${analyticsPrioFilter==="Urgent"?"selected":""}>Urgent</option></select>${analyticsStatusFilter||analyticsPrioFilter||analyticsSearch||analyticsUserFilter?`<button class="tb-btn" onclick="clearAllAnalyticsFilters()" style="font-size:.68rem;padding:5px 8px">Clear All</button>`:""}</div></div>${paginated.length?`<div class="at-table-wrap"><table class="at-table"><thead><tr><th>ID</th><th>Subject</th><th>Status</th><th>Priority</th><th>Created By</th><th>Assigned</th><th>Sub-Tasks</th><th>Due Date</th></tr></thead><tbody>${paginated.map(t=>{const ddi=dueDateInfo(t.todo_date,t.task_status);const sc={Open:"sp-open",Working:"sp-working","Pending Review":"sp-pending",Completed:"sp-completed",Cancelled:"sp-cancelled"}[t.task_status]||"sp-open";const prio=(t.task_priority||"medium").toLowerCase(),idx=allTasks.indexOf(t);const subs=getSubTasks(t.name||t.task_id),cSubs=subs.filter(s=>s.status==="Completed").length;return`<tr onclick="openTaskModal(${idx})"><td><span style="font-family:'Geist Mono',monospace;font-size:.65rem;color:var(--muted2)">${t.task_id||"—"}</span></td><td style="max-width:180px"><span style="font-size:.75rem;font-weight:600">${(t.subject||"—").slice(0,48)}${(t.subject||"").length>48?"…":""}</span></td><td><span class="status-pill ${sc}">${t.task_status||"—"}</span></td><td><span class="prio-pill pp-${prio}">${t.task_priority||"—"}</span></td><td><div class="assigned-chip"><div class="ac-av" style="background:${avatarColor(t.task_owner_name||"")}">${initials(t.task_owner_name)}</div><span>${(t.task_owner_name||"—").split(" ")[0]}</span></div></td><td>${t.assigned_user_name?`<div class="assigned-chip"><div class="ac-av" style="background:${avatarColor(t.assigned_user_name)}">${initials(t.assigned_user_name)}</div><span>${t.assigned_user_name.split(" ")[0]}</span></div>`:`<span style="color:var(--muted2);font-size:.68rem">—</span>`}</td><td>${subs.length?`<span style="font-size:.68rem;font-weight:700;color:var(--accent2)">⤵ ${cSubs}/${subs.length}</span>`:`<span style="color:var(--muted2);font-size:.68rem">—</span>`}</td><td>${ddi?`<span class="lt-date ${ddi.cls}">${ddi.label}</span>`:`<span style="color:var(--muted2)">—</span>`}</td></tr>`}).join("")}</tbody></table></div><div class="at-pagination"><span>${(analyticsPg-1)*analyticsPageSize+1}–${Math.min(analyticsPg*analyticsPageSize,filtered.length)} of ${filtered.length}</span><div class="pg-btns">${pgBtns}</div></div>`:`<div class="at-empty">No tasks match the filters.</div>`}</div></div>`;
