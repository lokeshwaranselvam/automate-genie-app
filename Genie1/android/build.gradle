def useFullOnnxRuntime = providers.gradleProperty('genieFullOnnxRuntime')
        .map { it.toBoolean() }.getOrElse(false)

allprojects {
    repositories {
        maven {
            url = rootProject.uri('runtime-maven')
            content { includeGroup 'in.homegenie.onnxruntime' }
        }
        google()
        mavenCentral()
    }

    if (!useFullOnnxRuntime) {
        configurations.configureEach {
            resolutionStrategy.dependencySubstitution {
                substitute(module('com.microsoft.onnxruntime:onnxruntime-android:1.28.0'))
                        .using(module('in.homegenie.onnxruntime:onnxruntime-android:1.28.0-sface1'))
            }
        }
    }
}

rootProject.buildDir = '../build'

subprojects {

    project.buildDir = "${rootProject.buildDir}/${project.name}"

    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
    }

    // ✅ Force Kotlin JVM 17 for ALL modules (including plugins)
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
